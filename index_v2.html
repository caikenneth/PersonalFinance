<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earnings & Spending</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4a6741;
      --primary-light: #6b9066;
      --primary-dark: #2d4220;
      --accent: #d4a373;
      --accent-light: #e8c5a0;
      --accent-dark: #8b6f47;
      --bg-base: #f5f1ed;
      --bg-elevated: #ffffff;
      --bg-hover: #ede8e3;
      --text-primary: #2c2c2c;
      --text-secondary: #6b6b6b;
      --text-tertiary: #999999;
      --border: #e0dbd5;
      --success: #5a9e5e;
      --warning: #c89852;
      --danger: #a85656;
      --info: #5a8fb3;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-base: #1a1a1a;
        --bg-elevated: #242424;
        --bg-hover: #2f2f2f;
        --text-primary: #f5f5f5;
        --text-secondary: #b8b8b8;
        --text-tertiary: #808080;
        --border: #3a3a3a;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
    }

    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    input, button, select {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 1.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .header {
      margin-bottom: 3rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      animation: slideDown 0.6s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .header p {
      font-size: 0.95rem;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .tab-nav {
      display: flex;
      gap: 0;
      margin-bottom: 2.5rem;
      border-bottom: 2px solid var(--border);
      position: relative;
      animation: slideDown 0.6s ease-out 0.1s backwards;
    }

    .tab-btn {
      padding: 1rem 1.5rem;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      position: relative;
      font-family: 'Sora', sans-serif;
      transition: color 0.3s ease;
    }

    .tab-btn.active {
      color: var(--primary);
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--primary);
      animation: slideRight 0.3s ease-out;
    }

    @keyframes slideRight {
      from {
        width: 0;
        left: 50%;
      }
      to {
        width: 100%;
        left: 0;
      }
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.4s ease-out;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card:nth-child(1) { animation-delay: 0.1s; }
    .card:nth-child(2) { animation-delay: 0.15s; }
    .card:nth-child(3) { animation-delay: 0.2s; }

    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
      animation: slideUp 0.5s ease-out 0.25s backwards;
    }

    .stat-card {
      background: linear-gradient(135deg, rgba(106, 144, 102, 0.08) 0%, rgba(212, 163, 115, 0.06) 100%);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      cursor: default;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transition: left 0.6s ease;
    }

    .stat-card:hover::before {
      left: 100%;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      font-family: 'Space Mono', monospace;
    }

    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 2.5rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 2rem;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(106, 144, 102, 0.04) 0%, transparent 100%);
    }

    .upload-zone:hover {
      border-color: var(--primary);
      background: linear-gradient(135deg, rgba(106, 144, 102, 0.08) 0%, transparent 100%);
    }

    .upload-zone.active {
      border-color: var(--primary);
      background: linear-gradient(135deg, rgba(106, 144, 102, 0.12) 0%, transparent 100%);
    }

    .upload-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      opacity: 0.7;
      transition: all 0.3s ease;
    }

    .upload-zone:hover .upload-icon {
      opacity: 1;
      transform: scale(1.1);
    }

    .upload-text {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--text-primary);
    }

    .upload-subtext {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .upload-status {
      font-size: 0.85rem;
      color: var(--accent);
      margin-top: 1rem;
      min-height: 1.2rem;
      animation: fadeIn 0.3s ease;
    }

    input[type="file"] {
      display: none;
    }

    .preview-img {
      max-width: 100%;
      max-height: 300px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 2rem;
      animation: fadeIn 0.4s ease;
    }

    .toggle-btn {
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
      font-family: 'Sora', sans-serif;
    }

    .toggle-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .section {
      margin-bottom: 2rem;
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .section-title::before {
      content: '';
      width: 3px;
      height: 1rem;
      background: var(--primary);
      border-radius: 2px;
    }

    .line-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 0;
      border-bottom: 1px solid var(--border);
      transition: all 0.2s ease;
    }

    .line-item:last-child {
      border-bottom: none;
    }

    .line-item:hover {
      background: var(--bg-hover);
      padding-left: 0.5rem;
      padding-right: 0.5rem;
      margin: 0 -0.5rem;
      border-radius: 6px;
    }

    .line-item-label {
      font-size: 0.9rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .line-item-value {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .line-item-amount {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
      font-family: 'Space Mono', monospace;
      text-align: right;
      min-width: 100px;
    }

    .line-item input {
      width: 100px;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Space Mono', monospace;
      text-align: right;
    }

    .line-item input:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--bg-elevated);
      box-shadow: 0 0 0 3px rgba(74, 103, 65, 0.1);
    }

    .subtotal {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 0;
      margin-top: 1rem;
      border-top: 2px solid var(--border);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      color: var(--text-primary);
    }

    .subtotal-label {
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }

    .subtotal-amount {
      font-family: 'Space Mono', monospace;
      font-size: 1.1rem;
    }

    .budget-item {
      margin-bottom: 1.75rem;
    }

    .budget-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .budget-label {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    .budget-amount {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--primary);
      font-family: 'Space Mono', monospace;
    }

    .budget-bar {
      width: 100%;
      height: 8px;
      background: var(--bg-hover);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .budget-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }

    .budget-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .budget-fill.needs {
      background: linear-gradient(90deg, #5a9e5e 0%, #6b9066 100%);
    }

    .budget-fill.wants {
      background: linear-gradient(90deg, #5a8fb3 0%, #5a9e5e 100%);
    }

    .budget-fill.savings {
      background: linear-gradient(90deg, #c89852 0%, #d4a373 100%);
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 0;
      margin-top: 2rem;
      border-top: 2px solid var(--border);
      font-weight: 700;
      font-size: 1.05rem;
    }

    .total-label {
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.9rem;
    }

    .total-amount {
      font-family: 'Space Mono', monospace;
      color: var(--primary);
    }

    .total-amount.positive {
      color: var(--success);
    }

    .total-amount.negative {
      color: var(--danger);
    }

    .input-group {
      margin-bottom: 1.5rem;
    }

    .input-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-field {
      width: 100%;
      padding: 0.9rem 1.1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-family: 'Space Mono', monospace;
      transition: all 0.2s ease;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(74, 103, 65, 0.1);
      background: var(--bg-elevated);
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 3rem;
      opacity: 0.4;
      margin-bottom: 1rem;
    }

    .empty-state-text {
      font-size: 0.95rem;
      line-height: 1.6;
    }

    @media (max-width: 640px) {
      .container {
        padding: 1rem;
      }

      .header h1 {
        font-size: 1.75rem;
      }

      .summary-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
      }

      .stat-card {
        padding: 1rem;
      }

      .stat-value {
        font-size: 1.25rem;
      }

      .card {
        padding: 1.25rem;
      }

      .tab-btn {
        padding: 0.85rem 1rem;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    class FinancialDashboard {
      constructor() {
        this.activeTab = 'paycheck';
        this.paystubImage = null;
        this.extractedData = {
          grossPay: 0,
          federalTax: 0,
          socialSecurityTax: 0,
          medicareTax: 0,
          stateTax: 0,
          cityTax: 0,
          sdiTax: 0,
          paidFamilyLeaveTax: 0,
          dental: 0,
          medical: 0,
          hsa: 0,
          retirement401k: 0,
        };
        this.spendingData = {
          housing: 0,
          groceries: 0,
          phone: 0,
          electric: 0,
          internet: 0,
          creditCard: 0,
          toiletries: 0,
          netflix: 0,
          insurance: 0,
          youtubeTV: 0,
          luxuries: 0,
        };
        this.staticCategories = {
          taxes: false,
          benefits: false,
        };
        this.processingImage = false;
        this.extractionStatus = '';
        this.init();
      }

      init() {
        this.render();
        this.attachEventListeners();
      }

      attachEventListeners() {
        const tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach(btn => {
          btn.addEventListener('click', (e) => {
            this.activeTab = e.target.getAttribute('data-tab');
            this.render();
          });
        });

        const uploadZone = document.querySelector('.upload-zone');
        if (uploadZone) {
          uploadZone.addEventListener('click', () => {
            const fileInput = document.querySelector('input[type="file"]');
            if (fileInput) fileInput.click();
          });
        }

        const fileInput = document.querySelector('input[type="file"]');
        if (fileInput) {
          fileInput.addEventListener('change', (e) => this.handleImageCapture(e));
        }

        const toggleBtns = document.querySelectorAll('.toggle-btn');
        toggleBtns.forEach(btn => {
          btn.addEventListener('click', (e) => {
            const category = e.target.getAttribute('data-category');
            this.staticCategories[category] = !this.staticCategories[category];
            this.render();
          });
        });

        const taxInputs = document.querySelectorAll('[data-field-type="tax"]');
        taxInputs.forEach(input => {
          input.addEventListener('change', (e) => {
            const field = e.target.getAttribute('data-field');
            this.extractedData[field] = Number(e.target.value) || 0;
            this.render();
          });
        });

        const spendingInputs = document.querySelectorAll('[data-field-type="spending"]');
        spendingInputs.forEach(input => {
          input.addEventListener('change', (e) => {
            const field = e.target.getAttribute('data-field');
            this.spendingData[field] = Number(e.target.value) || 0;
            this.render();
          });
        });
      }

      handleImageCapture(event) {
        const file = event.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (e) => {
          const base64Data = e.target.result.split(',')[1];
          this.paystubImage = e.target.result;
          this.processingImage = true;
          this.extractionStatus = 'Reading your pay stub...';
          this.render();

          try {
            const response = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model: 'claude-sonnet-4-20250514',
                max_tokens: 1000,
                messages: [
                  {
                    role: 'user',
                    content: [
                      {
                        type: 'image',
                        source: {
                          type: 'base64',
                          media_type: 'image/jpeg',
                          data: base64Data,
                        },
                      },
                      {
                        type: 'text',
                        text: 'Extract all financial data from this pay stub. Return ONLY valid JSON with these exact keys: grossPay, federalTax, socialSecurityTax, medicareTax, stateTax, cityTax, sdiTax, paidFamilyLeaveTax, dental, medical, hsa, retirement401k. Use numeric values only. If a field is not visible, use 0.',
                      },
                    ],
                  },
                ],
              }),
            });

            const data = await response.json();
            if (data.content?.[0]?.text) {
              const cleanedText = data.content[0].text
                .replace(/```json/g, '')
                .replace(/```/g, '')
                .trim();
              const parsed = JSON.parse(cleanedText);
              this.extractedData = { ...this.extractedData, ...parsed };
              this.extractionStatus = '✓ Pay stub loaded';
              this.processingImage = false;
              this.render();
              setTimeout(() => {
                this.extractionStatus = '';
                this.render();
              }, 2000);
            }
          } catch (error) {
            console.error('Error:', error);
            this.extractionStatus = 'Check your API key and try again';
            this.processingImage = false;
            this.render();
            setTimeout(() => {
              this.extractionStatus = '';
              this.render();
            }, 3000);
          }
        };
        reader.readAsDataURL(file);
      }

      formatCurrency(value) {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD',
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }).format(value);
      }

      getCalculations() {
        const totalTaxes = this.extractedData.federalTax + this.extractedData.socialSecurityTax + 
          this.extractedData.medicareTax + this.extractedData.stateTax + this.extractedData.cityTax + 
          this.extractedData.sdiTax + this.extractedData.paidFamilyLeaveTax;

        const totalBenefits = this.extractedData.dental + this.extractedData.medical + 
          this.extractedData.hsa + this.extractedData.retirement401k;

        const netPaycheck = this.extractedData.grossPay - totalTaxes - totalBenefits;
        const biMonthlyPaycheck = netPaycheck / 2;
        const weeklyPaycheck = (netPaycheck * 24) / 52;

        const totalSpending = Object.values(this.spendingData).reduce((a, b) => a + b, 0);
        const disposable = biMonthlyPaycheck - totalSpending;

        return {
          totalTaxes,
          totalBenefits,
          netPaycheck,
          biMonthlyPaycheck,
          weeklyPaycheck,
          totalSpending,
          disposable,
        };
      }

      render() {
        const root = document.getElementById('root');
        const calc = this.getCalculations();
        const hasPaystubData = this.extractedData.grossPay > 0;

        let html = `
          <div class="container">
            <div class="header">
              <h1>Earnings & Spending</h1>
              <p>Track your income, taxes, and spending in one place</p>
            </div>

            <div class="tab-nav">
              <button class="tab-btn ${this.activeTab === 'paycheck' ? 'active' : ''}" data-tab="paycheck">
                Paycheck
              </button>
              <button class="tab-btn ${this.activeTab === 'spending' ? 'active' : ''}" data-tab="spending">
                Spending
              </button>
            </div>
        `;

        if (this.activeTab === 'paycheck') {
          html += `
            <div class="tab-content active">
              <div class="upload-zone">
                <div class="upload-icon">📸</div>
                <div class="upload-text">Snap your pay stub</div>
                <div class="upload-subtext">Photo or file upload • Auto-fills income & deductions</div>
                ${this.extractionStatus ? `<div class="upload-status">${this.extractionStatus}</div>` : ''}
                <input type="file" accept="image/*" capture="environment">
              </div>

              ${this.paystubImage ? `<img src="${this.paystubImage}" alt="Pay stub" class="preview-img">` : ''}

              ${hasPaystubData ? `
                <div class="summary-grid">
                  <div class="stat-card">
                    <div class="stat-label">Gross</div>
                    <div class="stat-value">${this.formatCurrency(this.extractedData.grossPay)}</div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-label">Net</div>
                    <div class="stat-value">${this.formatCurrency(calc.netPaycheck)}</div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-label">Bi-Monthly</div>
                    <div class="stat-value">${this.formatCurrency(calc.biMonthlyPaycheck)}</div>
                  </div>
                  <div class="stat-card">
                    <div class="stat-label">Weekly</div>
                    <div class="stat-value">${this.formatCurrency(calc.weeklyPaycheck)}</div>
                  </div>
                </div>

                <div class="card">
                  <div class="card-title">
                    <div class="card-title-left">Deductions breakdown</div>
                    <button class="toggle-btn ${this.staticCategories.taxes ? 'active' : ''}" data-category="taxes">
                      ${this.staticCategories.taxes ? 'Fixed' : 'Adjust'}
                    </button>
                  </div>

                  <div class="section">
                    <div class="section-title">Taxes</div>
                    ${this.renderTaxItems(calc)}
                  </div>

                  <div class="section">
                    <div class="section-title">Benefits & Retirement</div>
                    ${this.renderBenefitItems(calc)}
                  </div>
                </div>

                <div class="card">
                  <div class="card-title">Budget allocation (50/30/20)</div>
                  
                  <div class="budget-item">
                    <div class="budget-header">
                      <span class="budget-label">Needs</span>
                      <span class="budget-amount">${this.formatCurrency((calc.weeklyPaycheck * 50) / 100 / 7)}</span>
                    </div>
                    <div class="budget-bar">
                      <div class="budget-fill needs" style="width: 50%"></div>
                    </div>
                  </div>

                  <div class="budget-item">
                    <div class="budget-header">
                      <span class="budget-label">Wants</span>
                      <span class="budget-amount">${this.formatCurrency((calc.weeklyPaycheck * 30) / 100 / 7)}</span>
                    </div>
                    <div class="budget-bar">
                      <div class="budget-fill wants" style="width: 30%"></div>
                    </div>
                  </div>

                  <div class="budget-item">
                    <div class="budget-header">
                      <span class="budget-label">Savings</span>
                      <span class="budget-amount">${this.formatCurrency((calc.weeklyPaycheck * 20) / 100 / 7)}</span>
                    </div>
                    <div class="budget-bar">
                      <div class="budget-fill savings" style="width: 20%"></div>
                    </div>
                  </div>
                </div>
              ` : `
                <div class="empty-state">
                  <div class="empty-state-icon">📊</div>
                  <div class="empty-state-text">
                    Capture your pay stub to see earnings, taxes, and budget allocation
                  </div>
                </div>
              `}
            </div>
          `;
        } else {
          html += `
            <div class="tab-content active">
              <div class="card">
                <div class="card-title">Current spending</div>

                <div class="section">
                  <div class="section-title">Where does it go?</div>
                  ${this.renderSpendingInputs()}
                </div>

                ${calc.biMonthlyPaycheck > 0 ? `
                  <div class="subtotal">
                    <span class="subtotal-label">Total Spending (Bi-Monthly)</span>
                    <span class="subtotal-amount">${this.formatCurrency(calc.totalSpending)}</span>
                  </div>

                  <div class="total-row">
                    <span class="total-label">Disposable Income</span>
                    <span class="total-amount ${calc.disposable >= 0 ? 'positive' : 'negative'}">
                      ${this.formatCurrency(calc.disposable)}
                    </span>
                  </div>
                ` : `
                  <div class="empty-state">
                    <div class="empty-state-icon">💰</div>
                    <div class="empty-state-text">
                      Add a pay stub to see your disposable income
                    </div>
                  </div>
                `}
              </div>
            </div>
          `;
        }

        html += '</div>';
        root.innerHTML = html;
        this.attachEventListeners();
      }

      renderTaxItems(calc) {
        const items = [
          { field: 'federalTax', label: 'Federal income tax' },
          { field: 'socialSecurityTax', label: 'Social security tax' },
          { field: 'medicareTax', label: 'Medicare tax' },
          { field: 'stateTax', label: 'State income tax' },
          { field: 'cityTax', label: 'City income tax' },
          { field: 'sdiTax', label: 'SDI (disability insurance)' },
          { field: 'paidFamilyLeaveTax', label: 'Paid family leave' },
        ];

        let html = '';
        items.forEach(item => {
          const value = this.extractedData[item.field];
          if (this.staticCategories.taxes) {
            html += `
              <div class="line-item">
                <span class="line-item-label">${item.label}</span>
                <span class="line-item-amount">${this.formatCurrency(value)}</span>
              </div>
            `;
          } else {
            html += `
              <div class="line-item">
                <span class="line-item-label">${item.label}</span>
                <div class="line-item-value">
                  <input type="number" data-field="${item.field}" data-field-type="tax" value="${value}" step="0.01">
                </div>
              </div>
            `;
          }
        });

        html += `
          <div class="subtotal">
            <span class="subtotal-label">Taxes Total</span>
            <span class="subtotal-amount">${this.formatCurrency(calc.totalTaxes)}</span>
          </div>
        `;

        return html;
      }

      renderBenefitItems(calc) {
        const items = [
          { field: 'dental', label: 'Dental' },
          { field: 'medical', label: 'Medical' },
          { field: 'hsa', label: 'HSA' },
          { field: 'retirement401k', label: '401(k)' },
        ];

        let html = '';
        items.forEach(item => {
          const value = this.extractedData[item.field];
          if (this.staticCategories.benefits) {
            html += `
              <div class="line-item">
                <span class="line-item-label">${item.label}</span>
                <span class="line-item-amount">${this.formatCurrency(value)}</span>
              </div>
            `;
          } else {
            html += `
              <div class="line-item">
                <span class="line-item-label">${item.label}</span>
                <div class="line-item-value">
                  <input type="number" data-field="${item.field}" data-field-type="tax" value="${value}" step="0.01">
                </div>
              </div>
            `;
          }
        });

        html += `
          <div class="subtotal">
            <span class="subtotal-label">Benefits Total</span>
            <span class="subtotal-amount">${this.formatCurrency(calc.totalBenefits)}</span>
          </div>
        `;

        return html;
      }

      renderSpendingInputs() {
        const labels = {
          housing: 'Housing',
          groceries: 'Groceries',
          phone: 'Phone bill',
          electric: 'Electric',
          internet: 'Internet',
          creditCard: 'Credit card fees',
          toiletries: 'Toiletries',
          netflix: 'Subscriptions',
          insurance: 'Insurance',
          youtubeTV: 'Other',
          luxuries: 'Luxuries & 1-offs',
        };

        let html = '';
        Object.entries(this.spendingData).forEach(([field, value]) => {
          html += `
            <div class="input-group">
              <label class="input-label">${labels[field]}</label>
              <input type="number" class="input-field" data-field="${field}" data-field-type="spending" value="${value}" step="0.01" placeholder="0.00">
            </div>
          `;
        });

        return html;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      new FinancialDashboard();
    });
  </script>
</body>
</html>
