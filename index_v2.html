<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earnings & Spending</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4a6741;
      --primary-light: #6b9066;
      --primary-dark: #2d4220;
      --accent: #d4a373;
      --accent-light: #e8c5a0;
      --accent-dark: #8b6f47;
      --bg-base: #f5f1ed;
      --bg-elevated: #ffffff;
      --bg-hover: #ede8e3;
      --text-primary: #2c2c2c;
      --text-secondary: #6b6b6b;
      --text-tertiary: #999999;
      --border: #e0dbd5;
      --success: #5a9e5e;
      --warning: #c89852;
      --danger: #a85656;
      --info: #5a8fb3;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-base: #1a1a1a;
        --bg-elevated: #242424;
        --bg-hover: #2f2f2f;
        --text-primary: #f5f5f5;
        --text-secondary: #b8b8b8;
        --text-tertiary: #808080;
        --border: #3a3a3a;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
    }

    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Smooth transitions everywhere */
    input, button, select {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Remove input spinner */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 1.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      margin-bottom: 3rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      animation: slideDown 0.6s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .header p {
      font-size: 0.95rem;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* Tabs */
    .tab-nav {
      display: flex;
      gap: 0;
      margin-bottom: 2.5rem;
      border-bottom: 2px solid var(--border);
      position: relative;
      animation: slideDown 0.6s ease-out 0.1s backwards;
    }

    .tab-btn {
      padding: 1rem 1.5rem;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      position: relative;
      font-family: 'Sora', sans-serif;
      transition: color 0.3s ease;
    }

    .tab-btn.active {
      color: var(--primary);
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--primary);
      animation: slideRight 0.3s ease-out;
    }

    @keyframes slideRight {
      from {
        width: 0;
        left: 50%;
      }
      to {
        width: 100%;
        left: 0;
      }
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.4s ease-out;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    /* Cards */
    .card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card:nth-child(1) { animation-delay: 0.1s; }
    .card:nth-child(2) { animation-delay: 0.15s; }
    .card:nth-child(3) { animation-delay: 0.2s; }

    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Summary Grid */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
      animation: slideUp 0.5s ease-out 0.25s backwards;
    }

    .stat-card {
      background: linear-gradient(135deg, rgba(106, 144, 102, 0.08) 0%, rgba(212, 163, 115, 0.06) 100%);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      cursor: default;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transition: left 0.6s ease;
    }

    .stat-card:hover::before {
      left: 100%;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      font-family: 'Space Mono', monospace;
    }

    /* Upload Zone */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 2.5rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 2rem;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(106, 144, 102, 0.04) 0%, transparent 100%);
    }

    .upload-zone:hover {
      border-color: var(--primary);
      background: linear-gradient(135deg, rgba(106, 144, 102, 0.08) 0%, transparent 100%);
    }

    .upload-zone.active {
      border-color: var(--primary);
      background: linear-gradient(135deg, rgba(106, 144, 102, 0.12) 0%, transparent 100%);
    }

    .upload-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      opacity: 0.7;
      transition: all 0.3s ease;
    }

    .upload-zone:hover .upload-icon {
      opacity: 1;
      transform: scale(1.1);
    }

    .upload-text {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--text-primary);
    }

    .upload-subtext {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .upload-status {
      font-size: 0.85rem;
      color: var(--accent);
      margin-top: 1rem;
      min-height: 1.2rem;
      animation: fadeIn 0.3s ease;
    }

    input[type="file"] {
      display: none;
    }

    .preview-img {
      max-width: 100%;
      max-height: 300px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 2rem;
      animation: fadeIn 0.4s ease;
    }

    /* Toggle Button */
    .toggle-btn {
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .toggle-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Section */
    .section {
      margin-bottom: 2rem;
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .section-title::before {
      content: '';
      width: 3px;
      height: 1rem;
      background: var(--primary);
      border-radius: 2px;
    }

    /* Line Item */
    .line-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 0;
      border-bottom: 1px solid var(--border);
      transition: all 0.2s ease;
    }

    .line-item:last-child {
      border-bottom: none;
    }

    .line-item:hover {
      background: var(--bg-hover);
      padding-left: 0.5rem;
      padding-right: 0.5rem;
      margin: 0 -0.5rem;
      border-radius: 6px;
    }

    .line-item-label {
      font-size: 0.9rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .line-item-value {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .line-item-amount {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
      font-family: 'Space Mono', monospace;
      text-align: right;
      min-width: 100px;
    }

    .line-item input {
      width: 100px;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Space Mono', monospace;
      text-align: right;
    }

    .line-item input:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--bg-elevated);
      box-shadow: 0 0 0 3px rgba(74, 103, 65, 0.1);
    }

    .subtotal {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 0;
      margin-top: 1rem;
      border-top: 2px solid var(--border);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      color: var(--text-primary);
    }

    .subtotal-label {
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }

    .subtotal-amount {
      font-family: 'Space Mono', monospace;
      font-size: 1.1rem;
    }

    /* Budget Bar */
    .budget-item {
      margin-bottom: 1.75rem;
    }

    .budget-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .budget-label {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    .budget-amount {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--primary);
      font-family: 'Space Mono', monospace;
    }

    .budget-bar {
      width: 100%;
      height: 8px;
      background: var(--bg-hover);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .budget-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }

    .budget-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .budget-fill.needs {
      background: linear-gradient(90deg, #5a9e5e 0%, #6b9066 100%);
    }

    .budget-fill.wants {
      background: linear-gradient(90deg, #5a8fb3 0%, #5a9e5e 100%);
    }

    .budget-fill.savings {
      background: linear-gradient(90deg, #c89852 0%, #d4a373 100%);
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 0;
      margin-top: 2rem;
      border-top: 2px solid var(--border);
      font-weight: 700;
      font-size: 1.05rem;
    }

    .total-label {
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.9rem;
    }

    .total-amount {
      font-family: 'Space Mono', monospace;
      color: var(--primary);
    }

    .total-amount.positive {
      color: var(--success);
    }

    .total-amount.negative {
      color: var(--danger);
    }

    /* Input Field */
    .input-group {
      margin-bottom: 1.5rem;
    }

    .input-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-field {
      width: 100%;
      padding: 0.9rem 1.1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-family: 'Space Mono', monospace;
      transition: all 0.2s ease;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(74, 103, 65, 0.1);
      background: var(--bg-elevated);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 3rem;
      opacity: 0.4;
      margin-bottom: 1rem;
    }

    .empty-state-text {
      font-size: 0.95rem;
      line-height: 1.6;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .container {
        padding: 1rem;
      }

      .header h1 {
        font-size: 1.75rem;
      }

      .summary-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
      }

      .stat-card {
        padding: 1rem;
      }

      .stat-value {
        font-size: 1.25rem;
      }

      .card {
        padding: 1.25rem;
      }

      .tab-btn {
        padding: 0.85rem 1rem;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useRef } = React;

    const FinancialDashboard = () => {
      const [activeTab, setActiveTab] = useState('paycheck');
      const [paystubImage, setPaystubImage] = useState(null);
      const [extractedData, setExtractedData] = useState({
        grossPay: 0,
        federalTax: 0,
        socialSecurityTax: 0,
        medicareTax: 0,
        stateTax: 0,
        cityTax: 0,
        sdiTax: 0,
        paidFamilyLeaveTax: 0,
        dental: 0,
        medical: 0,
        hsa: 0,
        retirement401k: 0,
      });
      const [spendingData, setSpendingData] = useState({
        housing: 0,
        groceries: 0,
        phone: 0,
        electric: 0,
        internet: 0,
        creditCard: 0,
        toiletries: 0,
        netflix: 0,
        insurance: 0,
        youtubeTV: 0,
        luxuries: 0,
      });
      const [staticCategories, setStaticCategories] = useState({
        taxes: false,
        benefits: false,
      });
      const fileInputRef = useRef(null);
      const [processingImage, setProcessingImage] = useState(false);
      const [extractionStatus, setExtractionStatus] = useState('');

      const handleImageCapture = async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (e) => {
          const base64Data = e.target.result.split(',')[1];
          setPaystubImage(e.target.result);
          setProcessingImage(true);
          setExtractionStatus('Reading your pay stub...');

          try {
            const response = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model: 'claude-sonnet-4-20250514',
                max_tokens: 1000,
                messages: [
                  {
                    role: 'user',
                    content: [
                      {
                        type: 'image',
                        source: {
                          type: 'base64',
                          media_type: 'image/jpeg',
                          data: base64Data,
                        },
                      },
                      {
                        type: 'text',
                        text: 'Extract all financial data from this pay stub. Return ONLY valid JSON with these exact keys: grossPay, federalTax, socialSecurityTax, medicareTax, stateTax, cityTax, sdiTax, paidFamilyLeaveTax, dental, medical, hsa, retirement401k. Use numeric values only. If a field is not visible, use 0.',
                      },
                    ],
                  },
                ],
              }),
            });

            const data = await response.json();
            if (data.content?.[0]?.text) {
              const cleanedText = data.content[0].text
                .replace(/```json/g, '')
                .replace(/```/g, '')
                .trim();
              const parsed = JSON.parse(cleanedText);
              setExtractedData(prev => ({ ...prev, ...parsed }));
              setExtractionStatus('✓ Pay stub loaded');
              setTimeout(() => setExtractionStatus(''), 2000);
            }
          } catch (error) {
            console.error('Error:', error);
            setExtractionStatus('Check your API key and try again');
            setTimeout(() => setExtractionStatus(''), 3000);
          } finally {
            setProcessingImage(false);
          }
        };
        reader.readAsDataURL(file);
      };

      const toggleStaticCategory = (category) => {
        setStaticCategories(prev => ({
          ...prev,
          [category]: !prev[category],
        }));
      };

      const updateExtractedData = (field, value) => {
        setExtractedData(prev => ({ ...prev, [field]: Number(value) || 0 }));
      };

      const updateSpendingData = (field, value) => {
        setSpendingData(prev => ({ ...prev, [field]: Number(value) || 0 }));
      };

      // Calculations
      const totalTaxes = extractedData.federalTax + extractedData.socialSecurityTax + 
        extractedData.medicareTax + extractedData.stateTax + extractedData.cityTax + 
        extractedData.sdiTax + extractedData.paidFamilyLeaveTax;

      const totalBenefits = extractedData.dental + extractedData.medical + 
        extractedData.hsa + extractedData.retirement401k;

      const netPaycheck = extractedData.grossPay - totalTaxes - totalBenefits;
      const biMonthlyPaycheck = netPaycheck / 2;
      const weeklyPaycheck = (netPaycheck * 24) / 52;

      const totalSpending = Object.values(spendingData).reduce((a, b) => a + b, 0);
      const disposable = biMonthlyPaycheck - totalSpending;

      const needsPercentage = 50;
      const wantsPercentage = 30;
      const savingsPercentage = 20;

      const needsAmount = (weeklyPaycheck * needsPercentage) / 100 / 7;
      const wantsAmount = (weeklyPaycheck * wantsPercentage) / 100 / 7;
      const savingsAmount = (weeklyPaycheck * savingsPercentage) / 100 / 7;

      const formatCurrency = (value) => {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD',
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }).format(value);
      };

      const taxItems = [
        { label: 'Federal income tax', value: extractedData.federalTax, field: 'federalTax' },
        { label: 'Social security tax', value: extractedData.socialSecurityTax, field: 'socialSecurityTax' },
        { label: 'Medicare tax', value: extractedData.medicareTax, field: 'medicareTax' },
        { label: 'State income tax', value: extractedData.stateTax, field: 'stateTax' },
        { label: 'City income tax', value: extractedData.cityTax, field: 'cityTax' },
        { label: 'SDI (disability insurance)', value: extractedData.sdiTax, field: 'sdiTax' },
        { label: 'Paid family leave', value: extractedData.paidFamilyLeaveTax, field: 'paidFamilyLeaveTax' },
      ];

      const benefitItems = [
        { label: 'Dental', value: extractedData.dental, field: 'dental' },
        { label: 'Medical', value: extractedData.medical, field: 'medical' },
        { label: 'HSA', value: extractedData.hsa, field: 'hsa' },
        { label: '401(k)', value: extractedData.retirement401k, field: 'retirement401k' },
      ];

      const spendingItems = [
        { label: 'Housing', value: spendingData.housing, field: 'housing' },
        { label: 'Groceries', value: spendingData.groceries, field: 'groceries' },
        { label: 'Phone bill', value: spendingData.phone, field: 'phone' },
        { label: 'Electric', value: spendingData.electric, field: 'electric' },
        { label: 'Internet', value: spendingData.internet, field: 'internet' },
        { label: 'Credit card fees', value: spendingData.creditCard, field: 'creditCard' },
        { label: 'Toiletries', value: spendingData.toiletries, field: 'toiletries' },
        { label: 'Subscriptions', value: spendingData.netflix, field: 'netflix' },
        { label: 'Insurance', value: spendingData.insurance, field: 'insurance' },
        { label: 'Luxuries & 1-offs', value: spendingData.luxuries, field: 'luxuries' },
      ];

      return (
        <div className="container">
          <div className="header">
            <h1>Earnings & Spending</h1>
            <p>Track your income, taxes, and spending in one place</p>
          </div>

          <div className="tab-nav">
            <button 
              className={`tab-btn ${activeTab === 'paycheck' ? 'active' : ''}`}
              onClick={() => setActiveTab('paycheck')}
            >
              Paycheck
            </button>
            <button 
              className={`tab-btn ${activeTab === 'spending' ? 'active' : ''}`}
              onClick={() => setActiveTab('spending')}
            >
              Spending
            </button>
          </div>

          {/* Paycheck Tab */}
          <div className={`tab-content ${activeTab === 'paycheck' ? 'active' : ''}`}>
            <div 
              className="upload-zone"
              onClick={() => fileInputRef.current?.click()}
            >
              <div className="upload-icon">📸</div>
              <div className="upload-text">Snap your pay stub</div>
              <div className="upload-subtext">Photo or file upload • Auto-fills income & deductions</div>
              {extractionStatus && <div className="upload-status">{extractionStatus}</div>}
              <input
                ref={fileInputRef}
                type="file"
                accept="image/*"
                capture="environment"
                onChange={handleImageCapture}
              />
            </div>

            {paystubImage && (
              <img src={paystubImage} alt="Pay stub" className="preview-img" />
            )}

            {extractedData.grossPay > 0 && (
              <>
                <div className="summary-grid">
                  <div className="stat-card">
                    <div className="stat-label">Gross</div>
                    <div className="stat-value">{formatCurrency(extractedData.grossPay)}</div>
                  </div>
                  <div className="stat-card">
                    <div className="stat-label">Net</div>
                    <div className="stat-value">{formatCurrency(netPaycheck)}</div>
                  </div>
                  <div className="stat-card">
                    <div className="stat-label">Bi-Monthly</div>
                    <div className="stat-value">{formatCurrency(biMonthlyPaycheck)}</div>
                  </div>
                  <div className="stat-card">
                    <div className="stat-label">Weekly</div>
                    <div className="stat-value">{formatCurrency(weeklyPaycheck)}</div>
                  </div>
                </div>

                <div className="card">
                  <div className="card-title">
                    <div className="card-title-left">
                      <span>Deductions breakdown</span>
                    </div>
                    <button 
                      className={`toggle-btn ${staticCategories.taxes ? 'active' : ''}`}
                      onClick={() => toggleStaticCategory('taxes')}
                    >
                      {staticCategories.taxes ? 'Fixed' : 'Adjust'}
                    </button>
                  </div>

                  <div className="section">
                    <div className="section-title">Taxes</div>
                    {taxItems.map(item => (
                      <div key={item.field} className="line-item">
                        <span className="line-item-label">{item.label}</span>
                        <div className="line-item-value">
                          {staticCategories.taxes ? (
                            <span className="line-item-amount">{formatCurrency(item.value)}</span>
                          ) : (
                            <input
                              type="number"
                              value={item.value}
                              onChange={(e) => updateExtractedData(item.field, e.target.value)}
                              step="0.01"
                            />
                          )}
                        </div>
                      </div>
                    ))}
                    <div className="subtotal">
                      <span className="subtotal-label">Taxes Total</span>
                      <span className="subtotal-amount">{formatCurrency(totalTaxes)}</span>
                    </div>
                  </div>

                  <div className="section">
                    <div className="section-title">Benefits & Retirement</div>
                    {benefitItems.map(item => (
                      <div key={item.field} className="line-item">
                        <span className="line-item-label">{item.label}</span>
                        <div className="line-item-value">
                          {staticCategories.benefits ? (
                            <span className="line-item-amount">{formatCurrency(item.value)}</span>
                          ) : (
                            <input
                              type="number"
                              value={item.value}
                              onChange={(e) => updateExtractedData(item.field, e.target.value)}
                              step="0.01"
                            />
                          )}
                        </div>
                      </div>
                    ))}
                    <div className="subtotal">
                      <span className="subtotal-label">Benefits Total</span>
                      <span className="subtotal-amount">{formatCurrency(totalBenefits)}</span>
                    </div>
                  </div>
                </div>

                <div className="card">
                  <div className="card-title">Budget allocation (50/30/20)</div>
                  
                  <div className="budget-item">
                    <div className="budget-header">
                      <span className="budget-label">Needs</span>
                      <span className="budget-amount">{formatCurrency(needsAmount)}</span>
                    </div>
                    <div className="budget-bar">
                      <div className="budget-fill needs" style={{ width: '50%' }}></div>
                    </div>
                  </div>

                  <div className="budget-item">
                    <div className="budget-header">
                      <span className="budget-label">Wants</span>
                      <span className="budget-amount">{formatCurrency(wantsAmount)}</span>
                    </div>
                    <div className="budget-bar">
                      <div className="budget-fill wants" style={{ width: '30%' }}></div>
                    </div>
                  </div>

                  <div className="budget-item">
                    <div className="budget-header">
                      <span className="budget-label">Savings</span>
                      <span className="budget-amount">{formatCurrency(savingsAmount)}</span>
                    </div>
                    <div className="budget-bar">
                      <div className="budget-fill savings" style={{ width: '20%' }}></div>
                    </div>
                  </div>
                </div>
              </>
            )}

            {extractedData.grossPay === 0 && (
              <div className="empty-state">
                <div className="empty-state-icon">📊</div>
                <div className="empty-state-text">
                  Capture your pay stub to see earnings, taxes, and budget allocation
                </div>
              </div>
            )}
          </div>

          {/* Spending Tab */}
          <div className={`tab-content ${activeTab === 'spending' ? 'active' : ''}`}>
            <div className="card">
              <div className="card-title">Current spending</div>

              <div className="section">
                <div className="section-title">Where does it go?</div>
                {spendingItems.map(item => (
                  <div key={item.field} className="input-group">
                    <label className="input-label">{item.label}</label>
                    <input
                      type="number"
                      className="input-field"
                      value={item.value}
                      onChange={(e) => updateSpendingData(item.field, e.target.value)}
                      step="0.01"
                      placeholder="0.00"
                    />
                  </div>
                ))}
              </div>

              {biMonthlyPaycheck > 0 && (
                <>
                  <div className="subtotal">
                    <span className="subtotal-label">Total Spending (Bi-Monthly)</span>
                    <span className="subtotal-amount">{formatCurrency(totalSpending)}</span>
                  </div>

                  <div className="total-row">
                    <span className="total-label">Disposable Income</span>
                    <span className={`total-amount ${disposable >= 0 ? 'positive' : 'negative'}`}>
                      {formatCurrency(disposable)}
                    </span>
                  </div>
                </>
              )}

              {biMonthlyPaycheck === 0 && (
                <div className="empty-state">
                  <div className="empty-state-icon">💰</div>
                  <div className="empty-state-text">
                    Add a pay stub to see your disposable income
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.render(<FinancialDashboard />, document.getElementById('root'));
  </script>
</body>
</html>
