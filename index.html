                <input type="number" class="ret-input" data-field="penaltyRate" value="${acc.penaltyRate || 0}" min="0" max="100" step="1" ${dis} onchange="dashboard.updateRetirementAccount('${acc.id}')" oninput="dashboard.updateRetirementAccount('${acc.id}')">
              </div>
            </div>
          </div>
        `;
        }).join('');
      }

      getAccountMetricValue(acc, metricType) {
        const taxRate = this.retirementInputs.estimatedTaxRate / 100;
        const penalty = (acc.penaltyRate || 0) / 100;
        switch (metricType) {
          case 'preTax':
            return acc.type === 'pre' ? acc.balance : acc.balance / (1 - taxRate);
          case 'postTax':
            return acc.type === 'post' ? acc.balance : acc.balance * (1 - taxRate);
          case 'liquidation':
            return acc.type === 'pre'
              ? acc.balance * (1 - taxRate) * (1 - penalty)
              : acc.balance * (1 - penalty);
          default:
            return acc.balance;
        }
      }

      renderMetricBreakdown(metricType, total) {
        return this.renderAccountBreakdown(
          this.retirementAccounts.filter(acc => acc.balance > 0 && !acc.hidden),
          total,
          (acc) => this.getAccountMetricValue(acc, metricType)
        );
      }

      // Shared segment-bar renderer used by any "hover to see the breakdown by
      // account" tile - retirement net worth, debt balances, etc. Keeps the
      // visual pattern (and any future refinements to it) in one place.
      // Colors use sequential getCategoryColor indices (same palette as the
      // spending donut and debt chart) rather than hash-based assignment, so
      // the breakdown bars feel visually consistent across all three tabs.
      renderAccountBreakdown(accounts, total, valueFn) {
        if (!total || total <= 0) {
          return `<div class="ret-nw-empty">No balances yet</div>`;
        }

        const segments = accounts
          .map((acc, idx) => {
            const value = valueFn(acc);
            const pct = (value / total) * 100;
            return { name: acc.name || 'Account', value, pct, color: this.getCategoryColor(idx) };
          })
          .filter(s => s.value > 0);

        if (segments.length === 0) {
          return `<div class="ret-nw-empty">No balances yet</div>`;
        }

        const labelThreshold = 14;

        const segmentsHTML = segments.map(s => {
          const showLabel = s.pct >= labelThreshold;
          const inner = showLabel
            ? `<span class="ret-nw-segment-label">${this.escapeHtml(s.name)}<br>${s.pct.toFixed(1)}%</span>`
            : '';
          return `<div class="ret-nw-segment" style="width:${s.pct}%; background:${s.color};" title="${this.escapeHtml(s.name)} - ${this.formatCurrency(s.value)} (${s.pct.toFixed(1)}%)">${inner}</div>`;
        }).join('');

        return `
          <div class="ret-nw-segments">${segmentsHTML}</div>
          <div class="ret-nw-total">${this.formatCurrency(total)}</div>
        `;
      }

      getDebtAccountMetricValue(acc, metricType) {
        switch (metricType) {
          case 'minPayments':
            return acc.minPayment || 0;
          case 'interest':
            return acc.balance * (acc.apr / 100) / 12;
          default:
            return acc.balance;
        }
      }

      renderDebtMetricBreakdown(metricType, total) {
        return this.renderAccountBreakdown(
          this.debtAccounts.filter(acc => acc.balance > 0 && !acc.hidden),
          total,
          (acc) => this.getDebtAccountMetricValue(acc, metricType)
        );
      }

      getDebtTotals() {
        let totalBalance = 0;
        let totalMinPayment = 0;
        let totalMonthlyInterest = 0;
        let aprWeightSum = 0;

        this.debtAccounts.forEach(acc => {
          if (acc.hidden) return;
          totalBalance += acc.balance;
          totalMinPayment += acc.minPayment || 0;
          totalMonthlyInterest += acc.balance * (acc.apr / 100) / 12;
          aprWeightSum += acc.balance * acc.apr;
        });

        const weightedAvgApr = totalBalance > 0 ? aprWeightSum / totalBalance : 0;

        return { totalBalance, totalMinPayment, totalMonthlyInterest, weightedAvgApr };
      }

      // Projects total debt balance forward month by month under one of three
      // strategies (minimum / current / strategy - see below), while also
      // splitting the balance into remaining principal vs. accrued unpaid
      // interest. Payments are applied interest-first, principal-second,
      // which is the standard amortization convention and is what makes the
      // stacked chart and the "you've now paid more in interest than you've
      // paid down in principal" milestone meaningful.
      //  - minimum: pay only the minimum on every debt
      //  - current: pay whatever the user entered as their monthly payment
      //  - strategy: pay minimums everywhere, then throw the extra payment
      //    (plus anything freed up as debts get paid off) at debts in
      //    avalanche (highest APR first) or snowball (smallest balance first)
      //    order
      getDebtProjections(view) {
        const maxMonths = 360;
        const strategy = this.debtInputs.strategy === 'snowball' ? 'snowball' : 'avalanche';
        const extra = this.debtInputs.extraMonthlyPayment || 0;
        const originalTotalMin = this.debtAccounts.filter(a => !a.hidden).reduce((s, a) => s + (a.minPayment || 0), 0);

        let accounts = this.debtAccounts.filter(a => !a.hidden).map(a => ({
          id: a.id,
          name: a.name,
          type: a.type,
          apr: a.apr || 0,
          minPayment: a.minPayment || 0,
          monthlyPayment: a.monthlyPayment || 0,
          monthlySpend: a.monthlySpend || 0,
          balance: a.balance || 0,
          principal: a.balance || 0,
          interestAccrued: 0,
        }));

        const applyPayment = (a, pay) => {
          const interestPortion = Math.min(a.interestAccrued, pay);
          a.interestAccrued -= interestPortion;
          a.principal -= (pay - interestPortion);
          a.balance -= pay;
        };

        const projections = [];
        let payoffMonth = null;
        let totalInterestPaid = 0;
        let principalIssued = accounts.reduce((s, a) => s + a.principal, 0);
        let principalRepaidToDate = 0;
        let interestExceedsPrincipalMonth = null;

        for (let month = 0; month <= maxMonths; month++) {
          const totalBalance = accounts.reduce((s, a) => s + Math.max(0, a.balance), 0);
          const totalPrincipal = accounts.reduce((s, a) => s + Math.max(0, a.principal), 0);
          const totalInterestAccrued = accounts.reduce((s, a) => s + Math.max(0, a.interestAccrued), 0);
          projections.push({
            month,
            value: Math.max(0, totalBalance),
            principal: Math.max(0, totalPrincipal),
            interestAccrued: Math.max(0, totalInterestAccrued),
          });

          if (interestExceedsPrincipalMonth === null && totalInterestPaid > 0 && totalInterestPaid > principalRepaidToDate) {
            interestExceedsPrincipalMonth = month;
          }

          if (totalBalance <= 0.01) {
            if (payoffMonth === null) payoffMonth = month;
            break;
          }

          accounts.forEach(a => {
            if (a.balance > 0) {
              const interest = a.balance * (a.apr / 100) / 12;
              a.balance += interest;
              a.interestAccrued += interest;
              totalInterestPaid += interest;
            }
          });

          accounts.forEach(a => {
            if (a.type === 'revolving' && a.balance > 0 && a.monthlySpend) {
              a.balance += a.monthlySpend;
              a.principal += a.monthlySpend;
              principalIssued += a.monthlySpend;
            }
          });

          if (view === 'minimum') {
            accounts.forEach(a => {
              const pay = Math.min(Math.max(0, a.balance), a.minPayment);
              applyPayment(a, pay);
            });
          } else if (view === 'current') {
            accounts.forEach(a => {
              const pay = Math.min(Math.max(0, a.balance), a.monthlyPayment);
              applyPayment(a, pay);
            });
          } else {
            accounts.forEach(a => {
              const pay = Math.min(Math.max(0, a.balance), a.minPayment);
              applyPayment(a, pay);
            });

            const stillOwingMinSum = accounts
              .filter(a => a.balance > 0.01)
              .reduce((s, a) => s + a.minPayment, 0);
            const freed = Math.max(0, originalTotalMin - stillOwingMinSum);
            let pool = extra + freed;

            const order = accounts
              .filter(a => a.balance > 0.01)
              .sort((a, b) => strategy === 'snowball' ? a.balance - b.balance : b.apr - a.apr);

            for (const acc of order) {
              if (pool <= 0) break;
              const additional = Math.min(acc.balance, pool);
              applyPayment(acc, additional);
              pool -= additional;
            }
          }

          principalRepaidToDate = principalIssued - accounts.reduce((s, a) => s + Math.max(0, a.principal), 0);
        }

        return { projections, payoffMonth, totalInterestPaid, interestExceedsPrincipalMonth };
      }

      applyTheme() {
        if (this.darkMode) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
      }

      attachModeToggleListener() {
        const modeToggle = document.querySelector('.mode-toggle');
        if (modeToggle) {
          modeToggle.removeEventListener('click', this.modeToggleHandler);
          this.modeToggleHandler = (e) => {
            e.preventDefault();
            e.stopPropagation();
            this.toggleMode();
          };
          modeToggle.addEventListener('click', this.modeToggleHandler);
        }
      }

      attachTabListeners() {
        const tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach(btn => {
          btn.removeEventListener('click', btn.clickHandler);
          btn.clickHandler = (e) => {
            // Ignore clicks originating from the demo badge - those
            // are handled by exitDemoModeForTab and should not switch tabs.
            if (e.target.closest('.demo-badge')) return;
            // A triple-tap on the header fires a confirm() dialog; on touch
            // browsers the ghost click that can follow a blocked touchend
            // sometimes lands on whatever is under the same coordinates
            // once the layout re-renders. This window blocks any tab
            // switch that occurs immediately after a triple-tap resolves,
            // so demo mode entry/exit can never be misread as navigation.
            if (this._suppressTabSwitchUntil && Date.now() < this._suppressTabSwitchUntil) return;
            const tabTarget = btn.getAttribute('data-tab');
            if (!tabTarget) return;
            this.activeTab = tabTarget;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.renderTabContent();
            this.attachModeToggleListener();
            this.attachTripleTapListener();
          };
          btn.addEventListener('click', btn.clickHandler);
        });
      }

      attachTripleTapListener() {
        if (this._tripleTapBound) return;
        this._tripleTapBound = true;

        this.headerTapState = { count: 0, timer: null };
        const eventType = this.isTouchDevice ? 'touchend' : 'click';

        document.addEventListener(eventType, (e) => {
          const target = e.target.closest('.header-content h1');
          if (!target) return;
          e.preventDefault();
          e.stopPropagation();

          const state = this.headerTapState;
          state.count++;
          if (state.timer) clearTimeout(state.timer);

          if (state.count >= 3) {
            state.count = 0;
            this._suppressTabSwitchUntil = Date.now() + 700;
            if (this.demoModeByTab[this.activeTab]) {
              this.exitDemoMode();
            } else {
              this.promptDemoMode();
            }
          } else {
            state.timer = setTimeout(() => { state.count = 0; }, this.isTouchDevice ? 500 : 600);
          }
        }, { passive: false });
      }

      // Maps each tab to how its demo mode captures, generates, and restores
      // data. This is the single source of truth for what "demo mode" means
      // per tab, so entering/exiting demo never has to know about tabs it
      // isn't operating on.
      getDemoTabHandlers() {
        return {
          paycheck: {
            capture: () => ({
              paystubs: JSON.parse(JSON.stringify(this.paystubs)),
              paycheckSections: JSON.parse(JSON.stringify(this.paycheckSections)),
              payFrequency: this.payFrequency,
              paycheckTimeScale: this.paycheckTimeScale,
              nextPaycheckSectionId: this.nextPaycheckSectionId,
              nextPaycheckLineId: this.nextPaycheckLineId,
            }),
            demo: () => ({
              paystubs: [JSON.parse(JSON.stringify(this.demoPaystubData))],
              paycheckSections: JSON.parse(JSON.stringify(this.demoPaycheckSections)),
              payFrequency: this.demoPayFrequency,
              paycheckTimeScale: 'monthly',
              nextPaycheckSectionId: this.nextPaycheckSectionId,
              nextPaycheckLineId: this.nextPaycheckLineId,
            }),
            restore: (snap) => {
              this.paystubs = snap.paystubs;
              this.paycheckSections = snap.paycheckSections;
              this.payFrequency = snap.payFrequency;
              this.paycheckTimeScale = snap.paycheckTimeScale;
              this.nextPaycheckSectionId = snap.nextPaycheckSectionId;
              this.nextPaycheckLineId = snap.nextPaycheckLineId;
            },
          },
          spending: {
            capture: () => ({
              spendingCategories: JSON.parse(JSON.stringify(this.spendingCategories)),
              categoryLabels: JSON.parse(JSON.stringify(this.categoryLabels)),
              categoryPlaceholders: JSON.parse(JSON.stringify(this.categoryPlaceholders)),
              nextCustomCategoryId: this.nextCustomCategoryId,
            }),
            demo: () => ({
              spendingCategories: JSON.parse(JSON.stringify(this.demoDemoData)),
              categoryLabels: JSON.parse(JSON.stringify(this.categoryLabels)),
              categoryPlaceholders: JSON.parse(JSON.stringify(this.categoryPlaceholders)),
              nextCustomCategoryId: this.nextCustomCategoryId,
            }),
            restore: (snap) => {
              this.spendingCategories = snap.spendingCategories;
              this.categoryLabels = snap.categoryLabels;
              this.categoryPlaceholders = snap.categoryPlaceholders;
              this.nextCustomCategoryId = snap.nextCustomCategoryId;
            },
          },
          retirement: {
            capture: () => ({
              retirementAccounts: JSON.parse(JSON.stringify(this.retirementAccounts)),
              retirementInputs: JSON.parse(JSON.stringify(this.retirementInputs)),
              nextRetirementAccountId: this.nextRetirementAccountId,
            }),
            demo: () => ({
              retirementAccounts: JSON.parse(JSON.stringify(this.demoRetirementData)),
              retirementInputs: {
                birthdate: '1992-06-15',
                targetRetirementAge: 65,
                annualPostRetireSpend: 75000,
                estimatedTaxRate: 22,
              },
              nextRetirementAccountId: this.nextRetirementAccountId,
            }),
            restore: (snap) => {
              this.retirementAccounts = snap.retirementAccounts;
              this.retirementInputs = snap.retirementInputs;
              this.nextRetirementAccountId = snap.nextRetirementAccountId;
            },
          },
          debt: {
            capture: () => ({
              debtAccounts: JSON.parse(JSON.stringify(this.debtAccounts)),
              debtInputs: JSON.parse(JSON.stringify(this.debtInputs)),
              nextDebtAccountId: this.nextDebtAccountId,
            }),
            demo: () => ({
              debtAccounts: JSON.parse(JSON.stringify(this.demoDebtData)),
              debtInputs: JSON.parse(JSON.stringify(this.demoDebtInputs)),
              nextDebtAccountId: this.nextDebtAccountId,
            }),
            restore: (snap) => {
              this.debtAccounts = snap.debtAccounts;
              this.debtInputs = snap.debtInputs;
              this.nextDebtAccountId = snap.nextDebtAccountId;
            },
          },
        };
      }

      promptDemoMode() {
        const result = confirm('Enter demo mode to explore features with sample data?');
        if (result) {
          this.enterDemoMode();
        }
      }

      enterDemoMode() {
        const tab = this.activeTab;
        const handlers = this.getDemoTabHandlers()[tab];
        if (!handlers) return;

        this.savedStateByTab[tab] = handlers.capture();
        handlers.restore(handlers.demo());
        this.demoModeByTab[tab] = true;

        this.renderHeaderAndTabs();
        this.renderTabContent();
        this.attachModeToggleListener();
      }

      exitDemoMode() {
        this.exitDemoModeForTab(this.activeTab, null);
      }

      // Exits demo mode for a specific tab. Can be called from the badge X
      // on any tab without changing the active view. If the exited tab is the
      // currently active one, the tab content re-renders with restored data.
      // If it's a background tab, only the header (badge) updates.
      exitDemoModeForTab(tab, event) {
        if (event) {
          event.preventDefault();
          event.stopPropagation();
        }

        const handlers = this.getDemoTabHandlers()[tab];
        const snapshot = this.savedStateByTab[tab];

        if (handlers && snapshot) {
          handlers.restore(snapshot);
        }
        this.demoModeByTab[tab] = false;
        this.savedStateByTab[tab] = null;

        this.renderHeaderAndTabs();
        this.attachModeToggleListener();

        if (tab === this.activeTab) {
          this.renderTabContent();
        }
      }

      formatCurrency(value) {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD',
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }).format(value);
      }

      roundCurrency(value) {
        return Math.round(value * 100) / 100;
      }

      // --- Shared currency input formatting system ---
      // Any input with data-currency="true" gets live comma formatting.
      // On focus: shows raw numeric value for easy editing.
      // On blur: formats with commas and up to 2 decimal places.
      // On input: re-formats after each keystroke while preserving cursor.
      // All callers that read currency input values must use parseCurrencyInput()
      // to strip commas before parseFloat. Internal data model is always floats.

      parseCurrencyInput(el) {
        const raw = typeof el === 'string' ? el : el.value;
        return parseFloat(raw.replace(/,/g, '')) || 0;
      }

      formatCurrencyInputValue(numericValue, showCents = false) {
        if (isNaN(numericValue) || numericValue === 0) return showCents ? '0.00' : '';
        if (showCents) {
          return numericValue.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        // While typing: show commas, no forced decimals
        return numericValue.toLocaleString('en-US', { maximumFractionDigits: 2 });
      }

      initCurrencyInput(el) {
        if (el._currencyFormatted) return; // idempotent
        el._currencyFormatted = true;

        // Show formatted value if one already exists (e.g. on re-render)
        const initialNum = this.parseCurrencyInput(el);
        if (initialNum > 0) {
          el.value = this.formatCurrencyInputValue(initialNum, true);
        }

        el.addEventListener('focus', () => {
          const num = this.parseCurrencyInput(el);
          el.value = num > 0 ? String(num) : '';
        });

        el.addEventListener('blur', () => {
          const num = this.parseCurrencyInput(el);
          el.value = num > 0 ? this.formatCurrencyInputValue(num, true) : '';
        });

        el.addEventListener('input', () => {
          const raw = el.value;
          // Allow: digits, one decimal point, commas
          const cleaned = raw.replace(/[^0-9.]/g, '');
          const parts = cleaned.split('.');
          const intPart = parts[0] ? parseInt(parts[0], 10) : 0;
          const hasDot = cleaned.includes('.');
          const fracPart = parts[1] !== undefined ? parts[1].slice(0, 2) : '';

          // Format the integer part with commas
          const formatted = intPart > 0
            ? intPart.toLocaleString('en-US') + (hasDot ? '.' + fracPart : '')
            : (hasDot ? '0.' + fracPart : '');

          // Only update if formatting actually changed to avoid cursor thrash
          if (el.value !== formatted) {
            const selEnd = el.selectionEnd;
            const prevLen = el.value.length;
            el.value = formatted;
            // Adjust cursor: commas being added/removed shift position
            const delta = formatted.length - prevLen;
            try { el.setSelectionRange(selEnd + delta, selEnd + delta); } catch (_) {}
          }
        });
      }

      // Attach currency formatting to all data-currency inputs in a container
      // (or the whole document if no container given).
      attachCurrencyInputs(container = document) {
        container.querySelectorAll('[data-currency="true"]').forEach(el => {
          this.initCurrencyInput(el);
        });
      }

      convertToMonthly(value, frequency) {
        return value * (this.frequencyMultipliers[frequency] || 1);
      }

      getCategoryMonthlyTotal(categoryKey) {
        const category = this.spendingCategories[categoryKey];
        return category.items.reduce((total, item) => {
          if (item.hidden) return total;
          return total + this.convertToMonthly(item.value || 0, item.frequency || 'monthly');
        }, 0);
      }

      getSpendingTotals() {
        let totalSpending = 0;
        Object.entries(this.spendingCategories).forEach(([categoryKey, category]) => {
          totalSpending += this.getCategoryMonthlyTotal(categoryKey);
        });
        return totalSpending;
      }

      getRetirementCurrentAge() {
        const birthdate = new Date(this.retirementInputs.birthdate);
        const today = new Date();
        let age = today.getFullYear() - birthdate.getFullYear();
        const monthDiff = today.getMonth() - birthdate.getMonth();
        if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthdate.getDate())) {
          age--;
        }
        return Math.max(0, age);
      }

      getRetirementTotals() {
        let totalNominal = 0;
        let totalPreTax = 0;
        let totalPostTax = 0;
        let totalLiquidation = 0;
        const taxRate = this.retirementInputs.estimatedTaxRate / 100;

        this.retirementAccounts.forEach(acc => {
          if (acc.hidden) return;
          totalNominal += acc.balance;
          const penalty = (acc.penaltyRate || 0) / 100;

          if (acc.type === 'pre') {
            totalPreTax += acc.balance;
            totalPostTax += acc.balance * (1 - taxRate);
            totalLiquidation += acc.balance * (1 - taxRate) * (1 - penalty);
          } else {
            totalPreTax += acc.balance / (1 - taxRate);
            totalPostTax += acc.balance;
            totalLiquidation += acc.balance * (1 - penalty);
          }
        });

        return { totalNominal, totalPreTax, totalPostTax, totalLiquidation };
      }

      // Runs the year-by-year retirement simulation while keeping principal
      // (starting balance + contributions) and gains (investment growth)
      // as separate running totals per account. Withdrawals draw down
      // principal first (return-of-capital-first), so gains only shrink
      // once principal on that account is exhausted. Growth only ever adds
      // to gains. This split is what powers the stacked chart, and each
      // component is passed through the same pre/post-tax normalization as
      // the total so the mix/pre/post views stay internally consistent.
      getRetirementProjectionsDetailed(startAge, endAge, view = 'mix') {
        const projections = [];
        const targetRetireAge = this.retirementInputs.targetRetirementAge;
        const annualSpend = this.retirementInputs.annualPostRetireSpend;
        const taxRate = this.retirementInputs.estimatedTaxRate / 100;

        let accountsCopy = this.retirementAccounts.filter(a => !a.hidden).map(a => ({
          type: a.type,
          balance: a.balance,
          principal: a.balance,
          inflow: a.inflow,
          ratePre: a.ratePre,
          ratePost: a.ratePost,
        }));

        const normalize = (value, type) => {
          if (view === 'pre') {
            return type === 'pre' ? value : value / (1 - taxRate);
          }
          if (view === 'post') {
            return type === 'post' ? value : value * (1 - taxRate);
          }
          return value;
        };

        for (let age = startAge; age <= endAge; age++) {
          const isRetired = age >= targetRetireAge;

          let rawYearValue = 0;
          let normalizedPrincipal = 0;
          let normalizedGains = 0;
          accountsCopy.forEach(acc => {
            rawYearValue += acc.balance;
            const gains = Math.max(0, acc.balance - acc.principal);
            normalizedPrincipal += normalize(acc.principal, acc.type);
            normalizedGains += normalize(gains, acc.type);
          });

          projections.push({
            age,
            principal: Math.max(0, normalizedPrincipal),
            gains: Math.max(0, normalizedGains),
            value: Math.max(0, normalizedPrincipal + normalizedGains),
          });

          accountsCopy.forEach(acc => {
            if (!isRetired) {
              const rate = acc.ratePre / 100;
              acc.balance = acc.balance * (1 + rate) + acc.inflow;
              acc.principal += acc.inflow;
            } else {
              const rate = acc.ratePost / 100;
              if (rawYearValue > 0) {
                const proportion = acc.balance / rawYearValue;
                const withdrawal = annualSpend * proportion;
                acc.balance = Math.max(0, acc.balance - withdrawal);
                acc.principal = Math.max(0, acc.principal - withdrawal);
              }
              acc.balance = acc.balance * (1 + rate);
            }
          });
        }

        return projections;
      }

      getRetirementProjections(startAge, endAge, view = 'mix') {
        return this.getRetirementProjectionsDetailed(startAge, endAge, view);
      }

      // Determines the three milestone ages surfaced on the Horizon chart.
      // These are computed once against nominal (unnormalized) dollars,
      // since they describe real annual cash-flow crossovers and should
      // land on the same age regardless of which normalized view (mix/pre/
      // post) the chart is currently displaying.
      getRetirementMilestones(startAge, endAge) {
        const targetRetireAge = this.retirementInputs.targetRetirementAge;
        const annualSpend = this.retirementInputs.annualPostRetireSpend;
        const activeAccounts = this.retirementAccounts.filter(a => !a.hidden);
        const totalAnnualContribution = activeAccounts.reduce((s, a) => s + (a.inflow || 0), 0);

        let accountsCopy = activeAccounts.map(a => ({
          type: a.type,
          balance: a.balance,
          inflow: a.inflow,
          ratePre: a.ratePre,
          ratePost: a.ratePost,
        }));

        let gainsExceedContributionAge = null;
        let gainsExceedSpendAge = null;

        for (let age = startAge; age <= endAge; age++) {
          const isRetired = age >= targetRetireAge;
          const rawYearValue = accountsCopy.reduce((s, a) => s + a.balance, 0);

          let annualGainsGenerated = 0;
          accountsCopy.forEach(acc => {
            const rate = (isRetired ? acc.ratePost : acc.ratePre) / 100;
            annualGainsGenerated += acc.balance * rate;
          });

          if (gainsExceedContributionAge === null && totalAnnualContribution > 0 && annualGainsGenerated > totalAnnualContribution) {
            gainsExceedContributionAge = age;
          }
          if (gainsExceedSpendAge === null && annualSpend > 0 && annualGainsGenerated > annualSpend) {
            gainsExceedSpendAge = age;
          }

          accountsCopy.forEach(acc => {
            if (!isRetired) {
              const rate = acc.ratePre / 100;
              acc.balance = acc.balance * (1 + rate) + acc.inflow;
            } else {
              const rate = acc.ratePost / 100;
              if (rawYearValue > 0) {
                const proportion = acc.balance / rawYearValue;
                acc.balance = Math.max(0, acc.balance - annualSpend * proportion);
              }
              acc.balance = acc.balance * (1 + rate);
            }
          });
        }

        return { targetRetireAge, gainsExceedContributionAge, gainsExceedSpendAge };
      }

      // Builds vertical marker annotations for a category-axis line chart.
      // Each marker is {index, color, label, labelPosition}. Index is the
      // position within the chart's own labels array (category scales in
      // chartjs-plugin-annotation accept either the label value or its
      // integer index - index is used here since debt labels are sparse).
      buildMarkerAnnotations(markers) {
        const annotations = {};
        markers.forEach((m, i) => {
          if (m.index === null || m.index === undefined) return;
          annotations[`marker${i}`] = {
            type: 'line',
            xMin: m.index,
            xMax: m.index,
            borderColor: m.color,
            borderWidth: 1.5,
            borderDash: [5, 4],
            label: {
              display: true,
              content: m.label,
              position: m.labelPosition || 'start',
              rotation: 90,
              backgroundColor: m.color,
              color: '#fff',
              font: { family: 'Plus Jakarta Sans', size: 9, weight: '600' },
              padding: { top: 3, bottom: 3, left: 5, right: 5 },
              borderRadius: 4
            }
          };
        });
        return annotations;
      }

      renderRetirementChart() {
        const currentAge = this.getRetirementCurrentAge();

        const mixProj = this.getRetirementProjectionsDetailed(currentAge, 100, 'mix');
        const preProj = this.getRetirementProjectionsDetailed(currentAge, 100, 'pre');
        const postProj = this.getRetirementProjectionsDetailed(currentAge, 100, 'post');
        const allValues = [...mixProj, ...preProj, ...postProj].map(p => p.value);
        const globalMax = Math.max(0, ...allValues);
        const yAxisMax = globalMax > 0 ? globalMax * 1.05 : undefined;

        const viewMap = { mix: mixProj, pre: preProj, post: postProj };
        const projections = viewMap[this.activeRetirementView] || mixProj;

        const labels = projections.map(p => `Age ${p.age}`);
        const principalData = projections.map(p => this.roundCurrency(p.principal));
        const gainsData = projections.map(p => this.roundCurrency(p.gains));

        const ctx = document.getElementById('retirementHorizonChart');
        if (!ctx) return;

        const style = getComputedStyle(document.documentElement);
        const mutedColor = style.getPropertyValue('--text-secondary').trim();
        const gridColor = style.getPropertyValue('--border').trim();
        const principalColor = this.getCategoryColor(1);
        const gainsColor = this.getCategoryColor(2);

        if (this.retirementChart) {
          this.retirementChart.destroy();
        }

        const yScaleConfig = {
          stacked: true,
          grid: { color: gridColor },
          ticks: {
            color: mutedColor,
            font: { family: 'Plus Jakarta Sans', size: 10 },
            callback: function(value) {
              if (value >= 1e6) return '$' + (value / 1e6).toFixed(1) + 'M';
              if (value >= 1e3) return '$' + (value / 1e3).toFixed(0) + 'k';
              return '$' + value;
            }
          }
        };
        if (yAxisMax !== undefined) {
          yScaleConfig.min = 0;
          yScaleConfig.max = yAxisMax;
        }

        const milestones = this.getRetirementMilestones(currentAge, 100);
        const ageToIndex = (age) => (age === null || age === undefined) ? null : Math.max(0, Math.min(labels.length - 1, age - currentAge));
        const markers = [
          { index: ageToIndex(milestones.targetRetireAge), color: 'rgb(168, 86, 86)', label: `Retire @ ${milestones.targetRetireAge}` },
          { index: ageToIndex(milestones.gainsExceedContributionAge), color: gainsColor, label: milestones.gainsExceedContributionAge ? `Gains > Contrib @ ${milestones.gainsExceedContributionAge}` : null },
          { index: ageToIndex(milestones.gainsExceedSpendAge), color: principalColor, label: milestones.gainsExceedSpendAge ? `Gains > Spend @ ${milestones.gainsExceedSpendAge}` : null },
        ].filter(m => m.index !== null);

        this.retirementChart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [
              {
                label: 'Principal',
                data: principalData,
                borderColor: principalColor,
                backgroundColor: principalColor,
                borderWidth: 2,
                pointRadius: 0,
                pointHoverRadius: 5,
                fill: 'origin',
                stack: 'networth',
                tension: 0.2
              },
              {
                label: 'Investment Gains',
                data: gainsData,
                borderColor: gainsColor,
                backgroundColor: gainsColor,
                borderWidth: 2,
                pointRadius: 0,
                pointHoverRadius: 5,
                fill: '-1',
                stack: 'networth',
                tension: 0.2
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: true,
                position: 'top',
                align: 'end',
                labels: {
                  color: mutedColor,
                  font: { family: 'Plus Jakarta Sans', size: 10 },
                  boxWidth: 10,
                  boxHeight: 10,
                  usePointStyle: true,
                  pointStyle: 'circle'
                }
              },
              tooltip: {
                mode: 'index',
                intersect: false,
                callbacks: {
                  label: (item) => ` ${item.dataset.label}: ${this.formatCurrency(item.parsed.y)}`
                }
              },
              annotation: {
                annotations: this.buildMarkerAnnotations(markers)
              }
            },
            scales: {
              x: {
                stacked: true,
                grid: { display: false },
                ticks: {
                  color: mutedColor,
                  font: { family: 'Plus Jakarta Sans', size: 10 },
                  maxTicksLimit: 8
                }
              },
              y: yScaleConfig
            },
            interaction: {
              intersect: false,
              mode: 'index'
            }
          }
        });
      }
