<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earnings & Spending</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4a6741;
      --primary-light: #6b9066;
      --primary-dark: #2d4220;
      --accent: #d4a373;
      --accent-light: #e8c5a0;
      --accent-dark: #8b6f47;
      --bg-base: #faf9f7;
      --bg-elevated: #ffffff;
      --bg-hover: #f0ebe5;
      --bg-input: #f5f1ed;
      --text-primary: #2c2c2c;
      --text-secondary: #7a7a7a;
      --text-tertiary: #a8a8a8;
      --border: #e8e3dd;
      --success: #5a9e5e;
      --warning: #c89852;
      --danger: #a85656;
    }

    html[data-theme="dark"],
    html[data-theme="dark"] * {
      color-scheme: dark;
    }

    html[data-theme="dark"] {
      --bg-base: #0f0f0f;
      --bg-elevated: #1a1a1a;
      --bg-hover: #242424;
      --bg-input: #161616;
      --text-primary: #f0f0f0;
      --text-secondary: #a8a8a8;
      --text-tertiary: #707070;
      --border: #2a2a2a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    input, button, select {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-family: inherit;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 3rem;
      animation: slideDown 0.6s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header-content h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }

    .header-content p {
      font-size: 0.9rem;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .mode-toggle {
      background: none;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.5rem 0.6rem;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      transition: all 0.3s ease;
      color: var(--text-secondary);
    }

    .mode-toggle:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--bg-hover);
    }

    .tab-nav {
      display: flex;
      gap: 0;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .tab-btn {
      padding: 1rem 0;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      position: relative;
      transition: color 0.3s ease;
      margin-right: 2rem;
    }

    .tab-btn.active {
      color: var(--primary);
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--primary);
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.3s ease-out;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.75rem;
      margin-bottom: 2rem;
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 1.5rem;
      opacity: 0.7;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .stat-card:hover {
      border-color: var(--primary);
    }

    .stat-value {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--primary);
      font-family: 'Space Mono', monospace;
      margin-bottom: 0.35rem;
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--text-tertiary);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 2.5rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 2rem;
      position: relative;
      overflow: hidden;
      background: var(--bg-input);
    }

    .upload-zone:hover {
      border-color: var(--primary);
      background: var(--bg-hover);
    }

    .upload-icon {
      font-size: 2rem;
      margin-bottom: 0.8rem;
      opacity: 0.6;
      transition: all 0.3s ease;
    }

    .upload-zone:hover .upload-icon {
      opacity: 1;
      transform: scale(1.05);
    }

    .upload-text {
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 0.3rem;
      color: var(--text-primary);
    }

    .upload-subtext {
      font-size: 0.8rem;
      color: var(--text-tertiary);
    }

    input[type="file"] {
      display: none;
    }

    .preview-img {
      max-width: 100%;
      max-height: 250px;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin-bottom: 2rem;
      animation: fadeIn 0.4s ease;
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 1.75rem 0 1rem 0;
      opacity: 0.7;
    }

    .paycheck-item {
      background: var(--bg-input);
      border-left: 2px solid var(--primary);
      padding: 0.9rem 0 0.9rem 1rem;
      margin-bottom: 0.5rem;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    .paycheck-item-header {
      font-weight: 500;
      font-size: 0.75rem;
      margin-bottom: 0.4rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.6;
    }

    .paycheck-item-value {
      color: var(--text-primary);
      font-family: 'Space Mono', monospace;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .line-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 0;
      border-bottom: 1px solid var(--border);
      transition: all 0.2s ease;
    }

    .line-item:last-child {
      border-bottom: none;
    }

    .line-item:hover {
      background: var(--bg-hover);
      padding: 0.85rem 0.5rem;
      margin: 0 -0.5rem;
      border-radius: 4px;
    }

    .line-item-label {
      font-size: 0.9rem;
      color: var(--text-secondary);
      font-weight: 450;
    }

    .line-item-amount {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-primary);
      font-family: 'Space Mono', monospace;
      text-align: right;
      min-width: 90px;
    }

    .subtotal {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      margin-top: 1rem;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      font-weight: 500;
      color: var(--text-primary);
      font-size: 0.9rem;
    }

    .subtotal-amount {
      font-family: 'Space Mono', monospace;
    }

    .budget-item {
      margin-bottom: 1.5rem;
    }

    .budget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
    }

    .budget-label {
      font-weight: 500;
      color: var(--text-secondary);
    }

    .budget-amount {
      font-weight: 600;
      color: var(--primary);
      font-family: 'Space Mono', monospace;
    }

    .budget-bar {
      width: 100%;
      height: 6px;
      background: var(--bg-input);
      border-radius: 3px;
      overflow: hidden;
    }

    .budget-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .budget-fill.needs {
      background: var(--primary);
    }

    .budget-fill.wants {
      background: var(--accent);
    }

    .budget-fill.savings {
      background: var(--primary-light);
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 0;
      margin-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-weight: 500;
      font-size: 0.95rem;
    }

    .total-label {
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.8rem;
    }

    .total-amount {
      font-family: 'Space Mono', monospace;
      color: var(--primary);
      font-size: 1.1rem;
      font-weight: 600;
    }

    .total-amount.positive {
      color: var(--success);
    }

    .total-amount.negative {
      color: var(--danger);
    }

    .empty-state {
      text-align: center;
      padding: 2.5rem 1.5rem;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 2.5rem;
      opacity: 0.3;
      margin-bottom: 0.75rem;
    }

    .empty-state-text {
      font-size: 0.9rem;
      line-height: 1.6;
    }

    /* Spending category styles */
    .spending-category {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      background: var(--bg-elevated);
      transition: all 0.3s ease;
    }

    .spending-category:hover {
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(74, 103, 65, 0.08);
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0;
    }

    .category-name {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-primary);
      flex: 1;
    }

    .category-total {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--primary);
      font-family: 'Space Mono', monospace;
      text-align: right;
    }

    .add-btn {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-size: 1.4rem;
      padding: 0;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .add-btn:hover {
      transform: scale(1.15);
      color: var(--primary-light);
    }

    .category-body {
      display: none;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .category-body.visible {
      display: block;
    }

    .subcategory-item {
      background: var(--bg-input);
      padding: 0.9rem;
      margin-bottom: 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      transition: all 0.2s ease;
      animation: slideInItem 0.3s ease-out;
    }

    @keyframes slideInItem {
      from {
        opacity: 0;
        transform: translateY(-10px);
        max-height: 0;
      }
      to {
        opacity: 1;
        transform: translateY(0);
        max-height: 500px;
      }
    }

    .subcategory-item:hover {
      border-color: var(--primary);
      background: var(--bg-hover);
    }

    .subcategory-row {
      display: grid;
      grid-template-columns: 1fr 80px 110px 28px;
      gap: 0.6rem;
      align-items: end;
    }

    .subcategory-input {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.85rem;
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-family: 'Space Mono', monospace;
      transition: all 0.2s ease;
    }

    .subcategory-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(74, 103, 65, 0.1);
    }

    .subcategory-input::placeholder {
      color: var(--text-tertiary);
      opacity: 0.6;
    }

    .frequency-select {
      padding: 0.5rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.8rem;
      background: var(--bg-elevated);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .frequency-select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(74, 103, 65, 0.1);
    }

    .remove-btn {
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 1.2rem;
      padding: 0;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .remove-btn:hover {
      color: var(--danger);
      transform: scale(1.1);
    }

    .simple-input-wrapper {
      display: grid;
      grid-template-columns: 1fr 80px 110px 28px;
      gap: 0.6rem;
      align-items: end;
    }

    .simple-input-field {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.85rem;
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-family: 'Space Mono', monospace;
      transition: all 0.2s ease;
    }

    .simple-input-field:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(74, 103, 65, 0.1);
    }

    .simple-input-field::placeholder {
      color: var(--text-tertiary);
      opacity: 0.6;
    }

    @media (max-width: 640px) {
      .container {
        padding: 1.5rem 1rem;
      }

      .header {
        flex-direction: column;
        gap: 1rem;
      }

      .header-content h1 {
        font-size: 1.6rem;
      }

      .summary-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
      }

      .stat-card {
        padding: 0.85rem;
      }

      .stat-value {
        font-size: 1.1rem;
      }

      .card {
        padding: 1.25rem;
      }

      .subcategory-row,
      .simple-input-wrapper {
        grid-template-columns: 1fr 70px 100px 28px;
        gap: 0.5rem;
      }

      .tab-btn {
        margin-right: 1.5rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    class FinancialDashboard {
      constructor() {
        this.activeTab = 'paycheck';
        this.darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
        this.paystubs = [];
        this.spendingCategories = {
          housing: { items: [] },
          groceries: { items: [] },
          phone: { items: [] },
          electric: { items: [] },
          internet: { items: [] },
          creditCard: { items: [] },
          toiletries: { items: [] },
          netflix: { items: [] },
          insurance: { items: [] },
          other: { items: [] },
        };
        this.categoryLabels = {
          housing: 'Housing',
          groceries: 'Groceries',
          phone: 'Phone bill',
          electric: 'Electric',
          internet: 'Internet',
          creditCard: 'Credit card fees',
          toiletries: 'Toiletries',
          netflix: 'Subscriptions',
          insurance: 'Insurance',
          other: 'Other',
        };
        this.categoryPlaceholders = {
          housing: 'Rent, Mortgage, Property tax',
          groceries: 'Whole Foods, Farmer\'s market',
          phone: 'Mobile plan, Phone line',
          electric: 'Utilities bill',
          internet: 'Home wifi provider',
          creditCard: 'Card fees, Interest',
          toiletries: 'Skincare, Hair care',
          netflix: 'Netflix, Hulu, Apple TV+',
          insurance: 'Auto, Health, Renters',
          other: 'Gym, Hobbies, Classes',
        };
        this.init();
      }

      init() {
        this.applyTheme();
        this.render();
        this.attachEventListeners();
      }

      applyTheme() {
        if (this.darkMode) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
      }

      formatCurrency(value) {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD',
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }).format(value);
      }

      toggleMode() {
        this.darkMode = !this.darkMode;
        this.applyTheme();
        const modeToggle = document.querySelector('.mode-toggle');
        if (modeToggle) {
          modeToggle.textContent = this.darkMode ? '☀️' : '🌙';
        }
      }

      attachEventListeners() {
        const tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach(btn => {
          btn.addEventListener('click', (e) => {
            this.activeTab = e.target.getAttribute('data-tab');
            this.render();
          });
        });

        const modeToggle = document.querySelector('.mode-toggle');
        if (modeToggle) {
          modeToggle.addEventListener('click', () => this.toggleMode());
        }

        const uploadZone = document.querySelector('.upload-zone');
        if (uploadZone) {
          uploadZone.addEventListener('click', () => {
            const fileInput = document.querySelector('input[type="file"]');
            if (fileInput) fileInput.click();
          });
        }

        const fileInput = document.querySelector('input[type="file"]');
        if (fileInput) {
          fileInput.addEventListener('change', (e) => this.handleImageCapture(e));
        }

        this.attachAddButtons();
        this.attachRemoveButtons();
        this.attachInputListeners();
      }

      attachAddButtons() {
        const addBtns = document.querySelectorAll('.add-btn');
        addBtns.forEach(btn => {
          btn.removeEventListener('click', btn.clickHandler);
          btn.clickHandler = (e) => {
            e.preventDefault();
            e.stopPropagation();
            const categoryKey = e.currentTarget.getAttribute('data-category');
            this.addSubcategoryItem(categoryKey);
          };
          btn.addEventListener('click', btn.clickHandler);
        });
      }

      attachRemoveButtons() {
        const removeBtns = document.querySelectorAll('.remove-btn');
        removeBtns.forEach(btn => {
          btn.removeEventListener('click', btn.clickHandler);
          btn.clickHandler = (e) => {
            e.preventDefault();
            e.stopPropagation();
            const categoryKey = e.currentTarget.getAttribute('data-category');
            const itemIndex = parseInt(e.currentTarget.getAttribute('data-item-index'));
            this.removeSubcategoryItem(categoryKey, itemIndex);
          };
          btn.addEventListener('click', btn.clickHandler);
        });
      }

      attachInputListeners() {
        const inputs = document.querySelectorAll('[data-input-type]');
        inputs.forEach(input => {
          input.removeEventListener('change', input.changeHandler);
          input.changeHandler = (e) => {
            const categoryKey = e.target.getAttribute('data-category');
            const itemIndex = e.target.getAttribute('data-item-index') ? parseInt(e.target.getAttribute('data-item-index')) : 0;
            const field = e.target.getAttribute('data-field');
            const value = field === 'label' ? e.target.value : (field === 'frequency' ? e.target.value : Number(e.target.value) || 0);
            
            if (!this.spendingCategories[categoryKey].items[itemIndex]) {
              this.spendingCategories[categoryKey].items[itemIndex] = { label: '', value: 0, frequency: 'monthly' };
            }
            this.spendingCategories[categoryKey].items[itemIndex][field] = value;
            
            // Update category total only
            const categoryElement = document.querySelector(`[data-category-total="${categoryKey}"]`);
            if (categoryElement) {
              const total = this.spendingCategories[categoryKey].items.reduce((sum, item) => sum + (item.value || 0), 0);
              categoryElement.textContent = this.formatCurrency(total);
            }
          };
          input.addEventListener('change', input.changeHandler);
        });
      }

      addSubcategoryItem(categoryKey) {
        const category = this.spendingCategories[categoryKey];
        const itemIndex = category.items.length;
        
        category.items.push({
          label: '',
          value: 0,
          frequency: 'monthly',
        });

        // Find the category body
        const categoryElement = document.querySelector(`[data-category-key="${categoryKey}"]`);
        if (!categoryElement) return;

        const categoryBody = categoryElement.querySelector('.category-body');
        if (!categoryBody) return;

        // Make sure body is visible
        if (!categoryBody.classList.contains('visible')) {
          categoryBody.classList.add('visible');
        }

        // Create new item HTML
        const placeholder = this.categoryPlaceholders[categoryKey];
        const itemHTML = `
          <div class="subcategory-item">
            <div class="subcategory-row">
              <input type="text" class="subcategory-input" data-input-type="sub" data-category="${categoryKey}" data-item-index="${itemIndex}" data-field="label" value="" placeholder="${placeholder}">
              <input type="number" class="subcategory-input" data-input-type="sub" data-category="${categoryKey}" data-item-index="${itemIndex}" data-field="value" value="0" step="0.01" placeholder="0.00">
              <select class="frequency-select" data-input-type="sub" data-category="${categoryKey}" data-item-index="${itemIndex}" data-field="frequency">
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="biweekly">Bi-weekly</option>
                <option value="monthly" selected>Monthly</option>
                <option value="yearly">Yearly</option>
              </select>
              <button class="remove-btn" data-category="${categoryKey}" data-item-index="${itemIndex}" title="Remove">×</button>
            </div>
          </div>
        `;

        // Insert before the simple input wrapper or after last item
        const simpleWrapper = categoryBody.querySelector('.simple-input-wrapper');
        const lastItem = categoryBody.querySelector('.subcategory-item:last-child');
        
        if (simpleWrapper) {
          simpleWrapper.remove();
        }

        categoryBody.insertAdjacentHTML('beforeend', itemHTML);

        // Reattach event listeners to new elements
        this.attachRemoveButtons();
        this.attachInputListeners();

        // Focus the new input
        const newInput = categoryBody.querySelector(`[data-item-index="${itemIndex}"]`);
        if (newInput) {
          setTimeout(() => newInput.focus(), 50);
        }
      }

      removeSubcategoryItem(categoryKey, itemIndex) {
        const category = this.spendingCategories[categoryKey];
        category.items.splice(itemIndex, 1);

        // Find and remove the item from DOM
        const categoryElement = document.querySelector(`[data-category-key="${categoryKey}"]`);
        if (!categoryElement) return;

        const itemElement = categoryElement.querySelector(`[data-item-index="${itemIndex}"]`).closest('.subcategory-item');
        if (itemElement) {
          itemElement.style.animation = 'slideInItem 0.3s ease-out reverse';
          setTimeout(() => itemElement.remove(), 300);
        }

        // Update indices of remaining items
        const categoryBody = categoryElement.querySelector('.category-body');
        if (categoryBody) {
          const items = categoryBody.querySelectorAll('.subcategory-item');
          items.forEach((item, idx) => {
            const inputs = item.querySelectorAll('[data-input-type="sub"]');
            inputs.forEach(input => {
              input.setAttribute('data-item-index', idx);
            });
            const removeBtn = item.querySelector('.remove-btn');
            if (removeBtn) removeBtn.setAttribute('data-item-index', idx);
          });
        }

        // Update category total
        const categoryElement2 = document.querySelector(`[data-category-total="${categoryKey}"]`);
        if (categoryElement2) {
          const total = category.items.reduce((sum, item) => sum + (item.value || 0), 0);
          categoryElement2.textContent = this.formatCurrency(total);
        }

        this.attachRemoveButtons();
      }

      handleImageCapture(event) {
        const file = event.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (e) => {
          const base64Data = e.target.result.split(',')[1];
          const paystubData = {
            image: e.target.result,
            extractedData: {
              grossPay: 0,
              federalTax: 0,
              socialSecurityTax: 0,
              medicareTax: 0,
              stateTax: 0,
              cityTax: 0,
              sdiTax: 0,
              paidFamilyLeaveTax: 0,
              dental: 0,
              medical: 0,
              hsa: 0,
              retirement401k: 0,
            },
          };

          this.paystubs.push(paystubData);
          this.render();

          try {
            const response = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model: 'claude-sonnet-4-20250514',
                max_tokens: 1000,
                messages: [
                  {
                    role: 'user',
                    content: [
                      {
                        type: 'image',
                        source: {
                          type: 'base64',
                          media_type: 'image/jpeg',
                          data: base64Data,
                        },
                      },
                      {
                        type: 'text',
                        text: 'Extract all financial data from this pay stub. Return ONLY valid JSON with these exact keys: grossPay, federalTax, socialSecurityTax, medicareTax, stateTax, cityTax, sdiTax, paidFamilyLeaveTax, dental, medical, hsa, retirement401k. Use numeric values only. If a field is not visible, use 0.',
                      },
                    ],
                  },
                ],
              }),
            });

            const data = await response.json();
            const lastPaystub = this.paystubs[this.paystubs.length - 1];
            if (data.content?.[0]?.text) {
              const cleanedText = data.content[0].text
                .replace(/```json/g, '')
                .replace(/```/g, '')
                .trim();
              const parsed = JSON.parse(cleanedText);
              lastPaystub.extractedData = { ...lastPaystub.extractedData, ...parsed };
              this.render();
            }
          } catch (error) {
            console.error('Error:', error);
            this.render();
          }
        };
        reader.readAsDataURL(file);
      }

      getPaycheckTotals() {
        const totals = {
          grossPay: 0,
          federalTax: 0,
          socialSecurityTax: 0,
          medicareTax: 0,
          stateTax: 0,
          cityTax: 0,
          sdiTax: 0,
          paidFamilyLeaveTax: 0,
          dental: 0,
          medical: 0,
          hsa: 0,
          retirement401k: 0,
        };

        this.paystubs.forEach(stub => {
          Object.keys(totals).forEach(key => {
            totals[key] += stub.extractedData[key] || 0;
          });
        });

        const totalTaxes = totals.federalTax + totals.socialSecurityTax + 
          totals.medicareTax + totals.stateTax + totals.cityTax + 
          totals.sdiTax + totals.paidFamilyLeaveTax;

        const totalBenefits = totals.dental + totals.medical + 
          totals.hsa + totals.retirement401k;

        const netPaycheck = totals.grossPay - totalTaxes - totalBenefits;
        const biMonthlyPaycheck = netPaycheck / 2;
        const weeklyPaycheck = (netPaycheck * 24) / 52;

        return {
          totals,
          totalTaxes,
          totalBenefits,
          netPaycheck,
          biMonthlyPaycheck,
          weeklyPaycheck,
        };
      }

      getSpendingTotals() {
        let totalSpending = 0;
        Object.values(this.spendingCategories).forEach(category => {
          category.items.forEach(item => {
            totalSpending += item.value || 0;
          });
        });
        return totalSpending;
      }

      render() {
        const root = document.getElementById('root');
        const paycheck = this.getPaycheckTotals();
        const hasPaystubData = this.paystubs.length > 0 && paycheck.totals.grossPay > 0;

        let html = `
          <div class="container">
            <div class="header">
              <div class="header-content">
                <h1>Earnings & Spending</h1>
                <p>Track your income and spending</p>
              </div>
              <button class="mode-toggle" title="Toggle light/dark mode">
                ${this.darkMode ? '☀️' : '🌙'}
              </button>
            </div>

            <div class="tab-nav">
              <button class="tab-btn ${this.activeTab === 'paycheck' ? 'active' : ''}" data-tab="paycheck">
                Paycheck
              </button>
              <button class="tab-btn ${this.activeTab === 'spending' ? 'active' : ''}" data-tab="spending">
                Spending
              </button>
            </div>
        `;

        if (this.activeTab === 'paycheck') {
          html += this.renderPaycheckTab(paycheck);
        } else {
          html += this.renderSpendingTab(paycheck);
        }

        html += '</div>';
        root.innerHTML = html;
        this.attachEventListeners();
      }

      renderPaycheckTab(paycheck) {
        let html = `<div class="tab-content active">`;

        html += `
          <div class="upload-zone">
            <div class="upload-icon">📄</div>
            <div class="upload-text">Add a pay stub</div>
            <div class="upload-subtext">Photo or file • Auto-extracts data</div>
            <input type="file" accept="image/*" capture="environment">
          </div>
        `;

        this.paystubs.forEach((stub, index) => {
          if (stub.image) {
            html += `<img src="${stub.image}" alt="Pay stub ${index + 1}" class="preview-img">`;
          }
        });

        if (paycheck.totals.grossPay > 0) {
          html += `
            <div class="card">
              <div class="summary-grid">
                <div class="stat-card">
                  <div class="stat-value">${this.formatCurrency(paycheck.totals.grossPay)}</div>
                  <div class="stat-label">Gross</div>
                </div>
                <div class="stat-card">
                  <div class="stat-value">${this.formatCurrency(paycheck.netPaycheck)}</div>
                  <div class="stat-label">Net</div>
                </div>
                <div class="stat-card">
                  <div class="stat-value">${this.formatCurrency(paycheck.biMonthlyPaycheck)}</div>
                  <div class="stat-label">Bi-monthly</div>
                </div>
                <div class="stat-card">
                  <div class="stat-value">${this.formatCurrency(paycheck.weeklyPaycheck)}</div>
                  <div class="stat-label">Weekly</div>
                </div>
              </div>
            </div>

            <div class="card">
              <div class="card-title">Taxes & Deductions</div>
              ${this.renderTaxBreakdown(paycheck)}
            </div>

            <div class="card">
              <div class="card-title">Benefits</div>
              ${this.renderBenefitBreakdown(paycheck)}
            </div>

            <div class="card">
              <div class="card-title">Budget allocation</div>
              ${this.renderBudgetAllocation(paycheck)}
            </div>
          `;
        } else {
          html += `
            <div class="empty-state">
              <div class="empty-state-icon">📊</div>
              <div class="empty-state-text">Add your pay stub to get started</div>
            </div>
          `;
        }

        html += '</div>';
        return html;
      }

      renderTaxBreakdown(paycheck) {
        const taxFields = [
          { key: 'federalTax', label: 'Federal income tax' },
          { key: 'socialSecurityTax', label: 'Social security' },
          { key: 'medicareTax', label: 'Medicare' },
          { key: 'stateTax', label: 'State income tax' },
          { key: 'cityTax', label: 'City income tax' },
          { key: 'sdiTax', label: 'SDI' },
          { key: 'paidFamilyLeaveTax', label: 'Paid family leave' },
        ];

        let html = '';

        if (this.paystubs.length === 1) {
          taxFields.forEach(field => {
            const value = this.paystubs[0].extractedData[field.key] || 0;
            html += `
              <div class="line-item">
                <span class="line-item-label">${field.label}</span>
                <span class="line-item-amount">${this.formatCurrency(value)}</span>
              </div>
            `;
          });
        } else {
          taxFields.forEach(field => {
            const total = paycheck.totals[field.key] || 0;
            html += `
              <div class="line-item">
                <span class="line-item-label">${field.label}</span>
                <span class="line-item-amount">${this.formatCurrency(total)}</span>
              </div>
            `;

            this.paystubs.forEach((stub, index) => {
              const value = stub.extractedData[field.key] || 0;
              if (value > 0) {
                html += `
                  <div class="paycheck-item">
                    <div class="paycheck-item-header">Paycheck ${index + 1}</div>
                    <div class="paycheck-item-value">${this.formatCurrency(value)}</div>
                  </div>
                `;
              }
            });
          });
        }

        html += `
          <div class="subtotal">
            <span>Total</span>
            <span class="subtotal-amount">${this.formatCurrency(paycheck.totalTaxes)}</span>
          </div>
        `;

        return html;
      }

      renderBenefitBreakdown(paycheck) {
        const benefitFields = [
          { key: 'dental', label: 'Dental' },
          { key: 'medical', label: 'Medical' },
          { key: 'hsa', label: 'HSA' },
          { key: 'retirement401k', label: '401(k)' },
        ];

        let html = '';

        if (this.paystubs.length === 1) {
          benefitFields.forEach(field => {
            const value = this.paystubs[0].extractedData[field.key] || 0;
            html += `
              <div class="line-item">
                <span class="line-item-label">${field.label}</span>
                <span class="line-item-amount">${this.formatCurrency(value)}</span>
              </div>
            `;
          });
        } else {
          benefitFields.forEach(field => {
            const total = paycheck.totals[field.key] || 0;
            html += `
              <div class="line-item">
                <span class="line-item-label">${field.label}</span>
                <span class="line-item-amount">${this.formatCurrency(total)}</span>
              </div>
            `;

            this.paystubs.forEach((stub, index) => {
              const value = stub.extractedData[field.key] || 0;
              if (value > 0) {
                html += `
                  <div class="paycheck-item">
                    <div class="paycheck-item-header">Paycheck ${index + 1}</div>
                    <div class="paycheck-item-value">${this.formatCurrency(value)}</div>
                  </div>
                `;
              }
            });
          });
        }

        html += `
          <div class="subtotal">
            <span>Total</span>
            <span class="subtotal-amount">${this.formatCurrency(paycheck.totalBenefits)}</span>
          </div>
        `;

        return html;
      }

      renderBudgetAllocation(paycheck) {
        const needs = (paycheck.weeklyPaycheck * 50) / 100 / 7;
        const wants = (paycheck.weeklyPaycheck * 30) / 100 / 7;
        const savings = (paycheck.weeklyPaycheck * 20) / 100 / 7;

        return `
          <div class="budget-item">
            <div class="budget-header">
              <span class="budget-label">Needs (50%)</span>
              <span class="budget-amount">${this.formatCurrency(needs)}</span>
            </div>
            <div class="budget-bar">
              <div class="budget-fill needs" style="width: 50%"></div>
            </div>
          </div>

          <div class="budget-item">
            <div class="budget-header">
              <span class="budget-label">Wants (30%)</span>
              <span class="budget-amount">${this.formatCurrency(wants)}</span>
            </div>
            <div class="budget-bar">
              <div class="budget-fill wants" style="width: 30%"></div>
            </div>
          </div>

          <div class="budget-item">
            <div class="budget-header">
              <span class="budget-label">Savings (20%)</span>
              <span class="budget-amount">${this.formatCurrency(savings)}</span>
            </div>
            <div class="budget-bar">
              <div class="budget-fill savings" style="width: 20%"></div>
            </div>
          </div>
        `;
      }

      renderSpendingTab(paycheck) {
        const totalSpending = this.getSpendingTotals();
        const disposable = paycheck.biMonthlyPaycheck - totalSpending;

        let html = `<div class="tab-content active"><div class="card">`;

        Object.entries(this.spendingCategories).forEach(([categoryKey, category]) => {
          if (categoryKey === 'other') return;
          html += this.renderSpendingCategory(categoryKey, category);
        });

        html += this.renderSpendingCategory('other', this.spendingCategories.other);

        html += `</div>`; 

        if (paycheck.biMonthlyPaycheck > 0) {
          html += `
            <div class="card">
              <div style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 0;">
                <span style="font-size: 0.9rem; color: var(--text-secondary);">Total spending</span>
                <span style="font-family: 'Space Mono', monospace; font-weight: 600; color: var(--text-primary);">${this.formatCurrency(totalSpending)}</span>
              </div>
              <div class="total-row">
                <span class="total-label">Disposable</span>
                <span class="total-amount ${disposable >= 0 ? 'positive' : 'negative'}">
                  ${this.formatCurrency(disposable)}
                </span>
              </div>
            </div>
          `;
        } else {
          html += `
            <div class="empty-state">
              <div class="empty-state-icon">💰</div>
              <div class="empty-state-text">Add a pay stub to see your disposable income</div>
            </div>
          `;
        }

        html += '</div>';

        return html;
      }

      renderSpendingCategory(categoryKey, category) {
        const categoryLabel = this.categoryLabels[categoryKey];
        const placeholder = this.categoryPlaceholders[categoryKey];
        const hasItems = category.items.length > 0;
        const categoryTotal = category.items.reduce((sum, item) => sum + (item.value || 0), 0);

        let html = `<div class="spending-category" data-category-key="${categoryKey}">`;

        html += `
          <div class="category-header">
            <span class="category-name">${categoryLabel}</span>
            <span class="category-total" data-category-total="${categoryKey}">${this.formatCurrency(categoryTotal)}</span>
            <button class="add-btn" data-category="${categoryKey}" title="Add item">+</button>
          </div>
        `;

        if (hasItems) {
          html += `<div class="category-body visible">`;

          category.items.forEach((item, itemIndex) => {
            html += `
              <div class="subcategory-item">
                <div class="subcategory-row">
                  <input type="text" class="subcategory-input" data-input-type="sub" data-category="${categoryKey}" data-item-index="${itemIndex}" data-field="label" value="${item.label || ''}" placeholder="${placeholder}">
                  <input type="number" class="subcategory-input" data-input-type="sub" data-category="${categoryKey}" data-item-index="${itemIndex}" data-field="value" value="${item.value || 0}" step="0.01" placeholder="0.00">
                  <select class="frequency-select" data-input-type="sub" data-category="${categoryKey}" data-item-index="${itemIndex}" data-field="frequency">
                    <option value="daily" ${item.frequency === 'daily' ? 'selected' : ''}>Daily</option>
                    <option value="weekly" ${item.frequency === 'weekly' ? 'selected' : ''}>Weekly</option>
                    <option value="biweekly" ${item.frequency === 'biweekly' ? 'selected' : ''}>Bi-weekly</option>
                    <option value="monthly" ${item.frequency === 'monthly' ? 'selected' : ''}>Monthly</option>
                    <option value="yearly" ${item.frequency === 'yearly' ? 'selected' : ''}>Yearly</option>
                  </select>
                  <button class="remove-btn" data-category="${categoryKey}" data-item-index="${itemIndex}" title="Remove">×</button>
                </div>
              </div>
            `;
          });

          html += `</div>`;
        } else {
          html += `
            <div class="category-body visible">
              <div class="simple-input-wrapper">
                <input type="text" class="simple-input-field" data-input-type="simple" data-category="${categoryKey}" data-field="label" placeholder="${placeholder}">
                <input type="number" class="simple-input-field" data-input-type="simple" data-category="${categoryKey}" data-field="value" placeholder="0.00" step="0.01">
                <select class="frequency-select" data-input-type="simple" data-category="${categoryKey}" data-field="frequency">
                  <option value="daily">Daily</option>
                  <option value="weekly">Weekly</option>
                  <option value="biweekly">Bi-weekly</option>
                  <option value="monthly" selected>Monthly</option>
                  <option value="yearly">Yearly</option>
                </select>
                <div style="width: 28px;"></div>
              </div>
            </div>
          `;
        }

        html += `</div>`;

        return html;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      new FinancialDashboard();
    });
  </script>
</body>
</html>
