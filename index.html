          </div>

          <div class="card">
            <div class="card-title">Benefits</div>
            ${this.renderBenefitBreakdown(paycheck)}
          </div>

          <div class="card">
            <div class="card-title">Budget allocation</div>
            ${this.renderBudgetAllocation(paycheck)}
          </div>
        `;
      }

      renderTaxBreakdown(paycheck) {
        const taxFields = [
          { key: 'federalTax', label: 'Federal income tax' },
          { key: 'socialSecurityTax', label: 'Social security' },
          { key: 'medicareTax', label: 'Medicare' },
          { key: 'stateTax', label: 'State income tax' },
          { key: 'cityTax', label: 'City income tax' },
          { key: 'sdiTax', label: 'SDI' },
          { key: 'paidFamilyLeaveTax', label: 'Paid family leave' },
        ];

        let html = '';

        if (this.paystubs.length === 1) {
          taxFields.forEach(field => {
            const value = this.paystubs[0].extractedData[field.key] || 0;
            html += `
              <div class="line-item">
                <span class="line-item-label">${field.label}</span>
                <span class="line-item-amount">${this.formatCurrency(value)}</span>
              </div>
            `;
          });
        } else {
          taxFields.forEach(field => {
            const total = paycheck.totals[field.key] || 0;
            html += `
              <div class="line-item">
                <span class="line-item-label">${field.label}</span>
                <span class="line-item-amount">${this.formatCurrency(total)}</span>
              </div>
            `;

            this.paystubs.forEach((stub, index) => {
              const value = stub.extractedData[field.key] || 0;
              if (value > 0) {
                html += `
                  <div style="padding-left: 1rem; margin-left: 0; background: var(--bg-input); border-left: 2px solid var(--primary); padding: 0.6rem 0 0.6rem 0.8rem; margin: 0.3rem 0; border-radius: 4px; font-size: 0.8rem;">
                    <div style="font-weight: 500; font-size: 0.7rem; margin-bottom: 0.2rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.6;">Paycheck ${index + 1}</div>
                    <div style="color: var(--text-primary); font-family: 'Roboto', sans-serif; font-weight: 500; font-size: 0.8rem;">${this.formatCurrency(value)}</div>
                  </div>
                `;
              }
            });
          });
        }

        html += `
          <div class="subtotal">
            <span>Total</span>
            <span class="subtotal-amount">${this.formatCurrency(paycheck.totalTaxes)}</span>
          </div>
        `;

        return html;
      }

      renderBenefitBreakdown(paycheck) {
        const benefitFields = [
          { key: 'dental', label: 'Dental' },
          { key: 'medical', label: 'Medical' },
          { key: 'hsa', label: 'HSA' },
          { key: 'retirement401k', label: '401(k)' },
        ];

        let html = '';

        if (this.paystubs.length === 1) {
          benefitFields.forEach(field => {
            const value = this.paystubs[0].extractedData[field.key] || 0;
            html += `
              <div class="line-item">
                <span class="line-item-label">${field.label}</span>
                <span class="line-item-amount">${this.formatCurrency(value)}</span>
              </div>
            `;
          });
        } else {
          benefitFields.forEach(field => {
            const total = paycheck.totals[field.key] || 0;
            html += `
              <div class="line-item">
                <span class="line-item-label">${field.label}</span>
                <span class="line-item-amount">${this.formatCurrency(total)}</span>
              </div>
            `;

            this.paystubs.forEach((stub, index) => {
              const value = stub.extractedData[field.key] || 0;
              if (value > 0) {
                html += `
                  <div style="padding-left: 1rem; margin-left: 0; background: var(--bg-input); border-left: 2px solid var(--primary); padding: 0.6rem 0 0.6rem 0.8rem; margin: 0.3rem 0; border-radius: 4px; font-size: 0.8rem;">
                    <div style="font-weight: 500; font-size: 0.7rem; margin-bottom: 0.2rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.6;">Paycheck ${index + 1}</div>
                    <div style="color: var(--text-primary); font-family: 'Roboto', sans-serif; font-weight: 500; font-size: 0.8rem;">${this.formatCurrency(value)}</div>
                  </div>
                `;
              }
            });
          });
        }

        html += `
          <div class="subtotal">
            <span>Total</span>
            <span class="subtotal-amount">${this.formatCurrency(paycheck.totalBenefits)}</span>
          </div>
        `;

        return html;
      }

      renderBudgetAllocation(paycheck) {
        const needs = (paycheck.weeklyPaycheck * 50) / 100 / 7;
        const wants = (paycheck.weeklyPaycheck * 30) / 100 / 7;
        const savings = (paycheck.weeklyPaycheck * 20) / 100 / 7;

        return `
          <div class="budget-item">
            <div class="budget-header">
              <span class="budget-label">Needs (50%)</span>
              <span class="budget-amount">${this.formatCurrency(needs)}</span>
            </div>
            <div class="budget-bar">
              <div class="budget-fill needs" style="width: 50%"></div>
            </div>
          </div>

          <div class="budget-item">
            <div class="budget-header">
              <span class="budget-label">Wants (30%)</span>
              <span class="budget-amount">${this.formatCurrency(wants)}</span>
            </div>
            <div class="budget-bar">
              <div class="budget-fill wants" style="width: 30%"></div>
            </div>
          </div>

          <div class="budget-item">
            <div class="budget-header">
              <span class="budget-label">Savings (20%)</span>
              <span class="budget-amount">${this.formatCurrency(savings)}</span>
            </div>
            <div class="budget-bar">
              <div class="budget-fill savings" style="width: 20%"></div>
            </div>
          </div>
        `;
      }

      renderSpendingCategoryHTML(categoryKey, category) {
        const categoryLabel = this.categoryLabels[categoryKey];
        const categoryTotal = this.getCategoryMonthlyTotal(categoryKey);
        const categoryPercentage = this.getCategoryPercentage(categoryKey);

        const tooltipText = `Monthly total (from mixed frequencies) - ${categoryPercentage}% of total spending`;
        let totalDisplay = this.formatCurrency(categoryTotal);

        if (this.showPercentageToggle) {
          totalDisplay = `${this.formatCurrency(categoryTotal)} (${categoryPercentage}%)`;
        }

        let html = `<div class="spending-category" data-category-key="${categoryKey}">`;

        html += `
          <div class="category-header">
            <span class="category-name">${this.escapeHtml(categoryLabel)}</span>
            <span class="category-total${this.showPercentageToggle ? ' show-percentage' : ''}" data-category-total="${categoryKey}" role="tooltip">
              ${totalDisplay}
              <div class="tooltip">${tooltipText}</div>
            </span>
            <button class="add-btn" title="Add item" aria-label="Add ${this.escapeHtml(categoryLabel)} item">+</button>
          </div>
        `;

        html += `<div class="category-body">`;

        category.items.forEach((item, itemIndex) => {
          html += `
            <div class="subcategory-item">
              <div class="subcategory-row">
                <input type="text" class="subcategory-input" data-input-type="sub" data-item-index="${itemIndex}" data-field="label" value="${this.escapeHtml(item.label || '')}" placeholder="" aria-label="Description for ${this.escapeHtml(categoryLabel)} item">
                <input type="number" class="subcategory-input currency-input" data-input-type="sub" data-item-index="${itemIndex}" data-field="value" value="${item.value > 0 ? item.value.toFixed(2) : '0.00'}" step="0.01" min="0" placeholder="0.00" aria-label="Amount for ${this.escapeHtml(categoryLabel)} item">
                <select class="frequency-select" data-input-type="sub" data-item-index="${itemIndex}" data-field="frequency" aria-label="Frequency for ${this.escapeHtml(categoryLabel)} item">
                  <option value="daily" ${item.frequency === 'daily' ? 'selected' : ''}>Daily</option>
                  <option value="weekly" ${item.frequency === 'weekly' ? 'selected' : ''}>Weekly</option>
                  <option value="biweekly" ${item.frequency === 'biweekly' ? 'selected' : ''}>Bi-wk</option>
                  <option value="monthly" ${item.frequency === 'monthly' ? 'selected' : ''}>Monthly</option>
                  <option value="yearly" ${item.frequency === 'yearly' ? 'selected' : ''}>Yearly</option>
                </select>
                <button class="remove-btn" data-item-index="${itemIndex}" title="Remove this item" aria-label="Remove">×</button>
              </div>
            </div>
          `;
        });

        html += `</div>`;
        html += `</div>`;

        return html;
      }

      renderAggregatedSpendingCardHTML(totalMonthly) {
        const tipText = this.isTouchDevice 
          ? 'Long press any category segment to explore its subcategories.'
          : 'Click any category segment to view its subcategories.';

        return `
          <div class="card breakdown-card-wrapper">
            <div class="card-title">Total Spending & Breakdown</div>
            <div class="spending-breakdown">
              <div class="breakdown-item" data-breakdown-period="daily">
                <div class="breakdown-label">Daily</div>
                <div class="breakdown-value">${this.formatCurrency(totalMonthly / 30)}</div>
              </div>
              <div class="breakdown-item" data-breakdown-period="weekly">
                <div class="breakdown-label">Weekly</div>
                <div class="breakdown-value">${this.formatCurrency(totalMonthly / 4.286)}</div>
              </div>
              <div class="breakdown-item active" data-breakdown-period="monthly">
                <div class="breakdown-label">Monthly</div>
                <div class="breakdown-value">${this.formatCurrency(totalMonthly)}</div>
              </div>
              <div class="breakdown-item" data-breakdown-period="yearly">
                <div class="breakdown-label">Yearly</div>
                <div class="breakdown-value">${this.formatCurrency(totalMonthly * 12)}</div>
              </div>
            </div>

            <div class="chart-container">
              <canvas id="timeScaleRefreshChart"></canvas>
              <div class="chart-center-text">
                <div class="label" id="centerLabelDisplay">Monthly</div>
                <div class="total-amount" id="lockedCenterDisplay">$0.00</div>
              </div>
            </div>

            <div class="chart-tip">${tipText}</div>
          </div>
        `;
      }

      render() {
        const root = document.getElementById('root');
        const paycheck = this.getPaycheckTotals();
        const hasPaystubData = this.paystubs.length > 0 && paycheck.totals.grossPay > 0;
        const totalSpending = this.getSpendingTotals();
        const disposable = paycheck.biMonthlyPaycheck - totalSpending;

        let html = `
          <div class="container">
            <div class="header">
              <div class="header-content">
                <h1>Earnings & Spending</h1>
                <p>Track your income and spending</p>
              </div>
              <button class="mode-toggle" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">
                ${this.darkMode ? '☀️' : '🌙'}
              </button>
            </div>

            <div class="tab-nav" role="tablist">
              <button class="tab-btn ${this.activeTab === 'paycheck' ? 'active' : ''}" data-tab="paycheck" role="tab" aria-selected="${this.activeTab === 'paycheck'}">
                Paycheck
              </button>
              <button class="tab-btn ${this.activeTab === 'spending' ? 'active' : ''}" data-tab="spending" role="tab" aria-selected="${this.activeTab === 'spending'}">
                Spending
              </button>
            </div>
        `;

        if (this.activeTab === 'paycheck') {
          html += `<div class="tab-content active" role="tabpanel">`;
          html += `
            <div class="upload-zone" role="button" tabindex="0">
              <div class="upload-icon">📄</div>
              <div class="upload-text">Add a pay stub</div>
              <div class="upload-subtext">Photo or file - Auto-extracts data</div>
              <input type="file" accept="image/*" capture="environment" aria-label="Upload pay stub image">
            </div>
          `;

          this.paystubs.forEach((stub, index) => {
            if (stub.image) {
              html += `<img src="${stub.image}" alt="Pay stub ${index + 1}" class="preview-img">`;
            }
          });

          if (hasPaystubData) {
            html += this.renderPaycheckCardsHTML(paycheck);
          } else {
            html += `
              <div class="empty-state">
                <div class="empty-state-icon">📊</div>
                <div class="empty-state-text">Add your pay stub to get started</div>
              </div>
            `;
          }
          html += '</div>';
        } else {
          html += `<div class="tab-content active" role="tabpanel">`;

          html += `<div class="spending-controls">
            <button class="sort-btn" title="Sort categories by spending percentage" aria-label="Sort by weight">
              <svg class="sort-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <polyline points="19 12 12 19 5 12"></polyline>
              </svg>
            </button>
          </div>`;

          html += `<div class="spending-categories-wrapper">`;
          Object.entries(this.spendingCategories).forEach(([categoryKey, category]) => {
            if (categoryKey === 'other') return;
            html += this.renderSpendingCategoryHTML(categoryKey, category);
          });

          html += this.renderSpendingCategoryHTML('other', this.spendingCategories.other);
          html += `</div>`;
          html += `<div style="height: 10px;"></div>`;
          html += `<button class="add-category-btn" title="Add new spending category" aria-label="Add new spending category">+</button>`;
          html += `<div style="height: 20px;"></div>`;

          html += this.renderAggregatedSpendingCardHTML(totalSpending);

          if (hasPaystubData) {
            html += `
              <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.85rem 0;">
                  <span style="font-size: 0.85rem; color: var(--text-secondary); font-family: 'Plus Jakarta Sans', sans-serif;">Total spending</span>
                  <span style="font-family: 'Roboto', sans-serif; font-weight: 600; color: var(--text-primary);">${this.formatCurrency(totalSpending)}</span>
                </div>
                <div class="total-row">
                  <span class="total-label">Disposable</span>
                  <span class="total-amount ${disposable >= 0 ? 'positive' : 'negative'}">
                    ${this.formatCurrency(disposable)}
                  </span>
                </div>
              </div>
            `;
          }

          html += '</div>';
        }

        html += '</div>';
        root.innerHTML = html;
        this.attachEventListeners();
        if (this.activeTab === 'spending') {
          setTimeout(() => this.initChart(), 100);
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      new FinancialDashboard();
    });
  </script>
</body>
</html>
