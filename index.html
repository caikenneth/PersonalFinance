<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Earnings & Spending</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6b8e66;
      --primary-light: #8fa686;
      --primary-dark: #4d6250;
      --accent: #c9a878;
      --accent-light: #ddb89d;
      --accent-dark: #a87d52;
      --bg-base: #e8dcc8;
      --bg-elevated: #f4ede4;
      --bg-hover: #ede5d8;
      --bg-input: #e5dcd0;
      --bg-item: #f8f4ef;
      --text-primary: #3a3a3a;
      --text-secondary: #6d6d6d;
      --text-tertiary: #9a9a9a;
      --border: #d9cebd;
      --success: #5a9e5e;
      --warning: #c89852;
      --danger: #a85656;
      --shadow: rgba(58, 58, 58, 0.08);
    }

    html[data-theme="dark"] {
      --bg-base: #2a2620;
      --bg-elevated: #3a3530;
      --bg-hover: #423d37;
      --bg-input: #363230;
      --bg-item: #403a35;
      --text-primary: #f0ebe4;
      --text-secondary: #b8aea0;
      --text-tertiary: #88807a;
      --border: #4a4539;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.6;
      transition: background-color 0.3s ease, color 0.3s ease;
      position: relative;
    }

    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 100vw;
    }

    input, button, select, textarea {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-family: inherit;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    button {
      -webkit-user-select: none;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 2rem;
      animation: slideDown 0.6s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header-content h1 {
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }

    .header-content p {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .mode-toggle {
      background: none;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.5rem 0.6rem;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      transition: all 0.3s ease;
      color: var(--text-secondary);
      outline: none;
      min-width: 44px;
      min-height: 44px;
    }

    .mode-toggle:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--bg-hover);
    }

    .mode-toggle:active {
      transform: scale(0.95);
    }

    .mode-toggle:focus {
      box-shadow: 0 0 0 2px rgba(107, 142, 102, 0.2);
      border-color: var(--primary);
    }

    .tab-nav {
      display: flex;
      gap: 0;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .tab-btn {
      padding: 1rem 0.75rem;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      position: relative;
      transition: color 0.3s ease;
      margin-right: 1.5rem;
      outline: none;
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    .tab-btn:focus {
      box-shadow: inset 0 -2px 0 var(--primary);
    }

    .tab-btn.active {
      color: var(--primary);
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--primary);
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.3s ease-out;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 8px var(--shadow);
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-title {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 1.25rem;
      opacity: 0.7;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
      box-shadow: 0 1px 4px var(--shadow);
    }

    .stat-card:hover {
      border-color: var(--primary);
      box-shadow: 0 2px 6px var(--shadow);
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 0.3rem;
      font-family: 'Roboto', sans-serif;
    }

    .stat-label {
      font-size: 0.65rem;
      color: var(--text-tertiary);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 2rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
      background: var(--bg-input);
      min-height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .upload-zone:hover {
      border-color: var(--primary);
      background: var(--bg-hover);
    }

    .upload-icon {
      font-size: 2rem;
      margin-bottom: 0.6rem;
      opacity: 0.6;
      transition: all 0.3s ease;
    }

    .upload-zone:hover .upload-icon {
      opacity: 1;
      transform: scale(1.05);
    }

    .upload-text {
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 0.2rem;
      color: var(--text-primary);
    }

    .upload-subtext {
      font-size: 0.75rem;
      color: var(--text-tertiary);
    }

    input[type="file"] {
      display: none;
    }

    .preview-img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
      animation: fadeIn 0.4s ease;
      box-shadow: 0 2px 8px var(--shadow);
    }

    .line-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
      transition: all 0.2s ease;
    }

    .line-item:last-child {
      border-bottom: none;
    }

    .line-item:hover {
      background: var(--bg-hover);
      padding: 0.75rem 0.5rem;
      margin: 0 -0.5rem;
      border-radius: 4px;
    }

    .line-item-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 450;
      flex: 1;
    }

    .line-item-amount {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-primary);
      font-family: 'Roboto', sans-serif;
      text-align: right;
      min-width: 80px;
    }

    .subtotal {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 0;
      margin-top: 0.75rem;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      font-weight: 500;
      color: var(--text-primary);
      font-size: 0.85rem;
    }

    .subtotal-amount {
      font-family: 'Roboto', sans-serif;
    }

    .budget-item {
      margin-bottom: 1.25rem;
    }

    .budget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
      font-size: 0.8rem;
    }

    .budget-label {
      font-weight: 500;
      color: var(--text-secondary);
    }

    .budget-amount {
      font-weight: 600;
      color: var(--primary);
      font-family: 'Roboto', sans-serif;
    }

    .budget-bar {
      width: 100%;
      height: 6px;
      background: var(--bg-input);
      border-radius: 3px;
      overflow: hidden;
    }

    .budget-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .budget-fill.needs {
      background: var(--primary);
    }

    .budget-fill.wants {
      background: var(--accent);
    }

    .budget-fill.savings {
      background: var(--primary-light);
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      margin-top: 1rem;
      border-top: 1px solid var(--border);
      font-weight: 500;
      font-size: 0.9rem;
    }

    .total-label {
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.75rem;
    }

    .total-amount {
      font-family: 'Roboto', sans-serif;
      color: var(--primary);
      font-size: 1rem;
      font-weight: 600;
    }

    .total-amount.positive {
      color: var(--success);
    }

    .total-amount.negative {
      color: var(--danger);
    }

    .empty-state {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 2.5rem;
      opacity: 0.3;
      margin-bottom: 0.5rem;
    }

    .empty-state-text {
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .spending-category {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      background: var(--bg-elevated);
      transition: all 0.3s ease;
      box-shadow: 0 1px 4px var(--shadow);
    }

    .spending-category:hover {
      border-color: var(--primary);
      box-shadow: 0 2px 8px var(--shadow);
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0;
    }

    .category-name {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-primary);
      flex: 1;
    }

    .category-total {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary);
      text-align: right;
      cursor: help;
      position: relative;
      font-family: 'Roboto', sans-serif;
      min-width: 70px;
    }

    .tooltip {
      visibility: hidden;
      background-color: var(--text-primary);
      color: var(--bg-elevated);
      text-align: center;
      border-radius: 6px;
      padding: 0.4rem 0.6rem;
      position: absolute;
      z-index: 1;
      bottom: 125%;
      right: 0;
      white-space: nowrap;
      font-size: 0.7rem;
      opacity: 0;
      transition: opacity 0.3s ease;
      box-shadow: 0 2px 6px var(--shadow);
    }

    .category-total:hover .tooltip {
      visibility: visible;
      opacity: 1;
    }

    .tooltip::after {
      content: "";
      position: absolute;
      top: 100%;
      right: 10px;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: var(--text-primary) transparent transparent transparent;
    }

    .add-btn {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-size: 1.3rem;
      padding: 0;
      width: 32px;
      height: 32px;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
      outline: none;
    }

    .add-btn:hover {
      transform: scale(1.15);
      color: var(--primary-light);
    }

    .add-btn:active {
      transform: scale(0.95);
    }

    .add-btn:focus {
      box-shadow: 0 0 0 2px rgba(107, 142, 102, 0.3);
      border-radius: 4px;
    }

    .category-body {
      display: none;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .category-body.visible {
      display: block;
    }

    .subcategory-item {
      background: var(--bg-item);
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      transition: all 0.2s ease;
      animation: slideInItem 0.3s ease-out;
      box-shadow: 0 1px 3px var(--shadow);
    }

    @keyframes slideInItem {
      from {
        opacity: 0;
        transform: translateY(-10px);
        max-height: 0;
      }
      to {
        opacity: 1;
        transform: translateY(0);
        max-height: 500px;
      }
    }

    .subcategory-item:hover {
      border-color: var(--primary);
      background: var(--bg-hover);
    }

    .subcategory-row {
      display: grid;
      grid-template-columns: 1fr 70px 90px 32px;
      gap: 0.5rem;
      align-items: end;
    }

    .subcategory-input {
      padding: 0.5rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.8rem;
      background: var(--bg-elevated);
      color: var(--text-primary);
      transition: all 0.2s ease;
      outline: none;
      min-height: 44px;
    }

    .subcategory-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(107, 142, 102, 0.1);
      background: var(--bg-elevated);
    }

    .subcategory-input::placeholder {
      color: var(--text-tertiary);
      opacity: 0.5;
    }

    .frequency-select {
      padding: 0.5rem 0.4rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.7rem;
      background: var(--bg-elevated);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
      min-height: 44px;
    }

    .frequency-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(107, 142, 102, 0.1);
    }

    .remove-btn {
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 1.2rem;
      padding: 0;
      width: 32px;
      height: 32px;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
      outline: none;
    }

    .remove-btn:hover {
      color: var(--danger);
      transform: scale(1.1);
    }

    .remove-btn:active {
      transform: scale(0.9);
    }

    .remove-btn:focus {
      box-shadow: 0 0 0 2px rgba(168, 86, 86, 0.3);
      border-radius: 4px;
    }

    .simple-input-wrapper {
      display: grid;
      grid-template-columns: 1fr 70px 90px 32px;
      gap: 0.5rem;
      align-items: end;
    }

    .simple-input-field {
      padding: 0.5rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.8rem;
      background: var(--bg-elevated);
      color: var(--text-primary);
      transition: all 0.2s ease;
      outline: none;
      min-height: 44px;
    }

    .simple-input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(107, 142, 102, 0.1);
    }

    .simple-input-field::placeholder {
      color: var(--text-tertiary);
      opacity: 0.6;
    }

    .currency-input {
      font-family: 'Roboto', sans-serif;
    }

    @media (min-width: 641px) {
      .summary-grid {
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      }
    }

    @media (max-width: 640px) {
      html {
        -webkit-text-size-adjust: none;
      }

      body {
        -webkit-user-select: none;
      }

      .container {
        padding: 1rem 0.75rem;
        max-width: 100%;
        overflow-x: hidden;
      }

      .header {
        margin-bottom: 1.5rem;
      }

      .header-content h1 {
        font-size: 1.5rem;
      }

      .header-content p {
        font-size: 0.8rem;
      }

      .stat-value {
        font-size: 1.1rem;
      }

      .card {
        padding: 1rem;
        margin-bottom: 1.25rem;
      }

      .tab-btn {
        padding: 0.9rem 0.5rem;
        font-size: 0.85rem;
        margin-right: 1rem;
      }

      .tooltip {
        right: auto;
        left: 0;
      }

      .tooltip::after {
        right: auto;
        left: 10px;
      }

      .spending-category {
        padding: 0.85rem;
      }

      .category-header {
        gap: 0.4rem;
      }

      .category-name {
        font-size: 0.8rem;
      }

      .category-total {
        font-size: 0.85rem;
        min-width: 60px;
      }

      .subcategory-row,
      .simple-input-wrapper {
        grid-template-columns: 1fr 55px 65px 40px;
        gap: 0.3rem;
      }

      .subcategory-input,
      .simple-input-field {
        font-size: 0.7rem;
        padding: 0.4rem 0.5rem;
        min-height: 40px;
      }

      .frequency-select {
        font-size: 0.65rem;
        padding: 0.4rem 0.3rem;
        min-height: 40px;
      }

      .upload-zone {
        padding: 1.5rem 0.75rem;
        min-height: 120px;
      }

      .upload-text {
        font-size: 0.85rem;
      }

      .upload-subtext {
        font-size: 0.7rem;
      }

      .add-btn,
      .remove-btn {
        min-width: 40px;
        min-height: 40px;
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    class FinancialDashboard {
      constructor() {
        this.activeTab = 'paycheck';
        this.darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
        this.paystubs = [];
        this.spendingCategories = {
          housing: { items: [] },
          groceries: { items: [] },
          phone: { items: [] },
          electric: { items: [] },
          internet: { items: [] },
          creditCard: { items: [] },
          toiletries: { items: [] },
          netflix: { items: [] },
          insurance: { items: [] },
          other: { items: [] },
        };
        this.categoryLabels = {
          housing: 'Housing',
          groceries: 'Groceries',
          phone: 'Phone bill',
          electric: 'Electric',
          internet: 'Internet',
          creditCard: 'Credit card fees',
          toiletries: 'Toiletries',
          netflix: 'Subscriptions',
          insurance: 'Insurance',
          other: 'Other',
        };
        this.categoryPlaceholders = {
          housing: 'Rent, Mortgage, Property tax',
          groceries: 'Whole Foods, Farmer\'s market',
          phone: 'Verizon, T-Mobile, AT&T',
          electric: 'Utilities bill',
          internet: 'Home wifi provider',
          creditCard: 'Card fees, Interest',
          toiletries: 'Skincare, Hair care',
          netflix: 'Netflix, Hulu, Apple TV+',
          insurance: 'Auto, Health, Renters',
          other: 'Gym, Hobbies, Classes',
        };
        this.frequencyMultipliers = {
          daily: 30,
          weekly: 4.286,
          biweekly: 2.143,
          monthly: 1,
          yearly: 0.0833,
        };
        this.init();
      }

      init() {
        this.applyTheme();
        this.render();
        this.attachEventListeners();
        this.attachModeToggleListener();
      }

      applyTheme() {
        if (this.darkMode) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
      }

      attachModeToggleListener() {
        const modeToggle = document.querySelector('.mode-toggle');
        if (modeToggle) {
          modeToggle.removeEventListener('click', this.modeToggleHandler);
          this.modeToggleHandler = (e) => {
            e.preventDefault();
            e.stopPropagation();
            this.toggleMode();
          };
          modeToggle.addEventListener('click', this.modeToggleHandler);
        }
      }

      formatCurrency(value) {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD',
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }).format(value);
      }

      convertToMonthly(value, frequency) {
        return value * (this.frequencyMultipliers[frequency] || 1);
      }

      getCategoryMonthlyTotal(categoryKey) {
        const category = this.spendingCategories[categoryKey];
        return category.items.reduce((total, item) => {
          return total + this.convertToMonthly(item.value || 0, item.frequency || 'monthly');
        }, 0);
      }

      toggleMode() {
        this.darkMode = !this.darkMode;
        this.applyTheme();
        const modeToggle = document.querySelector('.mode-toggle');
        if (modeToggle) {
          modeToggle.textContent = this.darkMode ? '☀️' : '🌙';
        }
      }

      attachEventListeners() {
        const tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach(btn => {
          btn.addEventListener('click', (e) => {
            this.activeTab = e.target.getAttribute('data-tab');
            this.render();
            this.attachModeToggleListener();
          });
        });

        const uploadZone = document.querySelector('.upload-zone');
        if (uploadZone) {
          uploadZone.addEventListener('click', () => {
            const fileInput = document.querySelector('input[type="file"]');
            if (fileInput) fileInput.click();
          });
        }

        const fileInput = document.querySelector('input[type="file"]');
        if (fileInput) {
          fileInput.addEventListener('change', (e) => this.handleImageCapture(e));
        }

        this.attachAddButtons();
        this.attachRemoveButtons();
        this.attachInputListeners();
      }

      attachAddButtons() {
        const addBtns = document.querySelectorAll('.add-btn');
        addBtns.forEach(btn => {
          btn.removeEventListener('click', btn.clickHandler);
          btn.clickHandler = (e) => {
            e.preventDefault();
            e.stopPropagation();
            const categoryKey = e.currentTarget.getAttribute('data-category');
            this.expandCategory(categoryKey);
          };
          btn.addEventListener('click', btn.clickHandler);
        });
      }

      attachRemoveButtons() {
        const removeBtns = document.querySelectorAll('.remove-btn');
        removeBtns.forEach(btn => {
          btn.removeEventListener('click', btn.clickHandler);
          btn.clickHandler = (e) => {
            e.preventDefault();
            e.stopPropagation();
            const categoryKey = e.currentTarget.getAttribute('data-category');
            const itemIndex = parseInt(e.currentTarget.getAttribute('data-item-index'));
            this.removeSubcategoryItem(categoryKey, itemIndex);
          };
          btn.addEventListener('click', btn.clickHandler);
        });
      }

      attachInputListeners() {
        const inputs = document.querySelectorAll('[data-input-type]');
        inputs.forEach(input => {
          input.removeEventListener('change', input.changeHandler);
          input.removeEventListener('focus', input.focusHandler);

          input.focusHandler = (e) => {
            if (e.target.value === '0' || e.target.value === '0.00') {
              e.target.value = '';
            }
          };

          input.changeHandler = (e) => {
            const categoryKey = e.target.getAttribute('data-category');
            const itemIndex = e.target.getAttribute('data-item-index') ? parseInt(e.target.getAttribute('data-item-index')) : 0;
            const field = e.target.getAttribute('data-field');
            let value = e.target.value;

            if (field !== 'label' && field !== 'frequency') {
              value = Number(value) || 0;
            }

            if (!this.spendingCategories[categoryKey].items[itemIndex]) {
              this.spendingCategories[categoryKey].items[itemIndex] = { label: '', value: 0, frequency: 'monthly' };
            }
            this.spendingCategories[categoryKey].items[itemIndex][field] = value;

            const categoryElement = document.querySelector(`[data-category-total="${categoryKey}"]`);
            if (categoryElement) {
              const total = this.getCategoryMonthlyTotal(categoryKey);
              categoryElement.textContent = this.formatCurrency(total);
            }
          };

          input.addEventListener('focus', input.focusHandler);
          input.addEventListener('change', input.changeHandler);
        });
      }

      expandCategory(categoryKey) {
        const category = this.spendingCategories[categoryKey];
        const hasSimpleInput = category.items.length === 0;

        if (hasSimpleInput) {
          const categoryElement = document.querySelector(`[data-category-key="${categoryKey}"]`);
          if (!categoryElement) return;

          const simpleWrapper = categoryElement.querySelector('.simple-input-wrapper');
          if (simpleWrapper) {
            const labelInput = simpleWrapper.querySelector('[data-field="label"]');
            const valueInput = simpleWrapper.querySelector('[data-field="value"]');
            const frequencySelect = simpleWrapper.querySelector('[data-field="frequency"]');

            const label = labelInput?.value || '';
            const value = Number(valueInput?.value) || 0;
            const frequency = frequencySelect?.value || 'monthly';

            category.items.push({
              label: label,
              value: value,
              frequency: frequency,
            });
          }
        }

        category.items.push({
          label: '',
          value: 0,
          frequency: 'monthly',
        });

        const categoryElement = document.querySelector(`[data-category-key="${categoryKey}"]`);
        if (!categoryElement) return;

        const categoryBody = categoryElement.querySelector('.category-body');
        if (!categoryBody) return;

        if (!categoryBody.classList.contains('visible')) {
          categoryBody.classList.add('visible');
        }

        const simpleWrapper = categoryBody.querySelector('.simple-input-wrapper');
        if (simpleWrapper) {
          simpleWrapper.remove();
        }

        categoryBody.innerHTML = '';
        category.items.forEach((item, itemIndex) => {
          const itemHTML = `
            <div class="subcategory-item">
              <div class="subcategory-row">
                <input type="text" class="subcategory-input" data-input-type="sub" data-category="${categoryKey}" data-item-index="${itemIndex}" data-field="label" value="${item.label || ''}" placeholder="" aria-label="Description for ${this.categoryLabels[categoryKey]} item">
                <input type="number" class="subcategory-input currency-input" data-input-type="sub" data-category="${categoryKey}" data-item-index="${itemIndex}" data-field="value" value="${item.value > 0 ? item.value : '0.00'}" step="0.01" min="0" placeholder="0.00" aria-label="Amount for ${this.categoryLabels[categoryKey]} item">
                <select class="frequency-select" data-input-type="sub" data-category="${categoryKey}" data-item-index="${itemIndex}" data-field="frequency" aria-label="Frequency for ${this.categoryLabels[categoryKey]} item">
                  <option value="daily" ${item.frequency === 'daily' ? 'selected' : ''}>Daily</option>
                  <option value="weekly" ${item.frequency === 'weekly' ? 'selected' : ''}>Weekly</option>
                  <option value="biweekly" ${item.frequency === 'biweekly' ? 'selected' : ''}>Bi-wk</option>
                  <option value="monthly" ${item.frequency === 'monthly' ? 'selected' : ''}>Monthly</option>
                  <option value="yearly" ${item.frequency === 'yearly' ? 'selected' : ''}>Yearly</option>
                </select>
                <button class="remove-btn" data-category="${categoryKey}" data-item-index="${itemIndex}" title="Remove this item" aria-label="Remove">×</button>
              </div>
            </div>
          `;
          categoryBody.insertAdjacentHTML('beforeend', itemHTML);
        });

        this.attachRemoveButtons();
        this.attachInputListeners();

        const categoryTotalElement = document.querySelector(`[data-category-total="${categoryKey}"]`);
        if (categoryTotalElement) {
          const total = this.getCategoryMonthlyTotal(categoryKey);
          categoryTotalElement.textContent = this.formatCurrency(total);
        }

        const secondItemLabel = categoryBody.querySelector(`[data-item-index="1"][data-field="label"]`);
        if (secondItemLabel) {
          setTimeout(() => secondItemLabel.focus(), 50);
        }
      }

      removeSubcategoryItem(categoryKey, itemIndex) {
        const category = this.spendingCategories[categoryKey];
        category.items.splice(itemIndex, 1);

        const categoryElement = document.querySelector(`[data-category-key="${categoryKey}"]`);
        if (!categoryElement) return;

        const itemElement = categoryElement.querySelector(`[data-item-index="${itemIndex}"]`)?.closest('.subcategory-item');
        if (itemElement) {
          itemElement.style.animation = 'slideInItem 0.3s ease-out reverse';
          setTimeout(() => itemElement.remove(), 300);
        }

        const categoryBody = categoryElement.querySelector('.category-body');
        if (categoryBody) {
          const items = categoryBody.querySelectorAll('.subcategory-item');
          items.forEach((item, idx) => {
            const inputs = item.querySelectorAll('[data-input-type="sub"]');
            inputs.forEach(input => {
              input.setAttribute('data-item-index', idx);
            });
            const removeBtn = item.querySelector('.remove-btn');
            if (removeBtn) removeBtn.setAttribute('data-item-index', idx);
          });
        }

        const categoryTotalElement = document.querySelector(`[data-category-total="${categoryKey}"]`);
        if (categoryTotalElement) {
          const total = this.getCategoryMonthlyTotal(categoryKey);
          categoryTotalElement.textContent = this.formatCurrency(total);
        }

        this.attachRemoveButtons();
      }

      handleImageCapture(event) {
        const file = event.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (e) => {
          const base64Data = e.target.result.split(',')[1];
          const paystubData = {
            image: e.target.result,
            extractedData: {
              grossPay: 0,
              federalTax: 0,
              socialSecurityTax: 0,
              medicareTax: 0,
              stateTax: 0,
              cityTax: 0,
              sdiTax: 0,
              paidFamilyLeaveTax: 0,
              dental: 0,
              medical: 0,
              hsa: 0,
              retirement401k: 0,
            },
          };

          this.paystubs.push(paystubData);
          this.render();
          this.attachModeToggleListener();

          try {
            const response = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model: 'claude-sonnet-4-20250514',
                max_tokens: 1000,
                messages: [
                  {
                    role: 'user',
                    content: [
                      {
                        type: 'image',
                        source: {
                          type: 'base64',
                          media_type: 'image/jpeg',
                          data: base64Data,
                        },
                      },
                      {
                        type: 'text',
                        text: 'Extract all financial data from this pay stub. Return ONLY valid JSON with these exact keys: grossPay, federalTax, socialSecurityTax, medicareTax, stateTax, cityTax, sdiTax, paidFamilyLeaveTax, dental, medical, hsa, retirement401k. Use numeric values only. If a field is not visible, use 0.',
                      },
                    ],
                  },
                ],
              }),
            });

            const data = await response.json();
            const lastPaystub = this.paystubs[this.paystubs.length - 1];
            if (data.content?.[0]?.text) {
              const cleanedText = data.content[0].text
                .replace(/```json/g, '')
                .replace(/```/g, '')
                .trim();
              const parsed = JSON.parse(cleanedText);
              lastPaystub.extractedData = { ...lastPaystub.extractedData, ...parsed };
              this.render();
              this.attachModeToggleListener();
            }
          } catch (error) {
            console.error('Error:', error);
            this.render();
            this.attachModeToggleListener();
          }
        };
        reader.readAsDataURL(file);
      }

      getPaycheckTotals() {
        const totals = {
          grossPay: 0,
          federalTax: 0,
          socialSecurityTax: 0,
          medicareTax: 0,
          stateTax: 0,
          cityTax: 0,
          sdiTax: 0,
          paidFamilyLeaveTax: 0,
          dental: 0,
          medical: 0,
          hsa: 0,
          retirement401k: 0,
        };

        this.paystubs.forEach(stub => {
          Object.keys(totals).forEach(key => {
            totals[key] += stub.extractedData[key] || 0;
          });
        });

        const totalTaxes = totals.federalTax + totals.socialSecurityTax + 
          totals.medicareTax + totals.stateTax + totals.cityTax + 
          totals.sdiTax + totals.paidFamilyLeaveTax;

        const totalBenefits = totals.dental + totals.medical + 
          totals.hsa + totals.retirement401k;

        const netPaycheck = totals.grossPay - totalTaxes - totalBenefits;
        const biMonthlyPaycheck = netPaycheck / 2;
        const weeklyPaycheck = (netPaycheck * 24) / 52;

        return {
          totals,
          totalTaxes,
          totalBenefits,
          netPaycheck,
          biMonthlyPaycheck,
          weeklyPaycheck,
        };
      }

      getSpendingTotals() {
        let totalSpending = 0;
        Object.entries(this.spendingCategories).forEach(([categoryKey, category]) => {
          totalSpending += this.getCategoryMonthlyTotal(categoryKey);
        });
        return totalSpending;
      }

                <div class="subcategory-row">
                  <input type="text" class="subcategory-input" data-input-type="sub" data-category="${categoryKey}" data-item-index="${itemIndex}" data-field="label" value="${item.label || ''}" placeholder="" aria-label="Description for ${categoryLabel} item">
                  <input type="number" class="subcategory-input currency-input" data-input-type="sub" data-category="${categoryKey}" data-item-index="${itemIndex}" data-field="value" value="${item.value > 0 ? item.value : '0.00'}" step="0.01" min="0" placeholder="0.00" aria-label="Amount for ${categoryLabel} item">
                  <select class="frequency-select" data-input-type="sub" data-category="${categoryKey}" data-item-index="${itemIndex}" data-field="frequency" aria-label="Frequency for ${categoryLabel} item">
                    <option value="daily" ${item.frequency === 'daily' ? 'selected' : ''}>Daily</option>
                    <option value="weekly" ${item.frequency === 'weekly' ? 'selected' : ''}>Weekly</option>
                    <option value="biweekly" ${item.frequency === 'biweekly' ? 'selected' : ''}>Bi-wk</option>
                    <option value="monthly" ${item.frequency === 'monthly' ? 'selected' : ''}>Monthly</option>
                    <option value="yearly" ${item.frequency === 'yearly' ? 'selected' : ''}>Yearly</option>
                  </select>
                  <button class="remove-btn" data-category="${categoryKey}" data-item-index="${itemIndex}" title="Remove this item" aria-label="Remove">×</button>
                </div>
              </div>
            `;
          });

          html += `</div>`;
        } else {
          html += `
            <div class="category-body visible">
              <div class="simple-input-wrapper">
                <input type="text" class="simple-input-field" data-input-type="simple" data-category="${categoryKey}" data-field="label" placeholder="${placeholder}" aria-label="Description for ${categoryLabel}">
                <input type="number" class="simple-input-field currency-input" data-input-type="simple" data-category="${categoryKey}" data-field="value" placeholder="0.00" step="0.01" min="0" value="0.00" aria-label="Amount for ${categoryLabel}">
                <select class="frequency-select" data-input-type="simple" data-category="${categoryKey}" data-field="frequency" aria-label="Frequency for ${categoryLabel}">
                  <option value="daily">Daily</option>
                  <option value="weekly">Weekly</option>
                  <option value="biweekly">Bi-wk</option>
                  <option value="monthly" selected>Monthly</option>
                  <option value="yearly">Yearly</option>
                </select>
                <div style="width: 40px;"></div>
              </div>
            </div>
          `;
        }

        html += `</div>`;

        return html;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      new FinancialDashboard();
    });
  </script>
</body>
</html>
