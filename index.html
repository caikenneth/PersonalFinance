      // Returns a human-readable label for a month index on the debt chart.
      // Uses days/weeks for very short horizons, months for medium, and
      // quarter/year markers for long ones - always ensuring a minimum of
      // 8 visible tick labels across the full horizon range.
      formatDebtMonthLabel(month, horizonMonths, tickStep) {
        if (month === 0) return 'Now';
        if (horizonMonths <= 6) {
          // Sub-6-month horizon: label every month
          return `Mo ${month}`;
        }
        if (horizonMonths <= 24) {
          // Up to 2 years: label on tickStep boundaries
          return month % tickStep === 0 ? `Mo ${month}` : '';
        }
        if (horizonMonths <= 60) {
          // Up to 5 years: quarter labels
          return month % tickStep === 0 ? `Mo ${month}` : '';
        }
        // Beyond 5 years: year labels
        return month % 12 === 0 ? `Yr ${month / 12}` : '';
      }

      // Computes the x-axis tick step that guarantees at least 8 visible
      // tick marks for any horizon length. The result is always a "clean"
      // interval (monthly, quarterly, half-yearly, or yearly) so labels
      // land on calendar-meaningful boundaries.
      computeDebtTickStep(horizonMonths) {
        const minTicks = 8;
        const candidates = [1, 2, 3, 6, 12, 24, 36, 60];
        for (const step of candidates) {
          if (Math.floor(horizonMonths / step) >= minTicks - 1) {
            return step;
          }
        }
        return Math.max(1, Math.floor(horizonMonths / minTicks));
      }

      renderDebtChart() {
        const strategyResult = this.getDebtProjections('strategy');
        const currentResult = this.getDebtProjections('current');
        const minimumResult = this.getDebtProjections('minimum');

        const candidateMonths = [strategyResult.payoffMonth, currentResult.payoffMonth, minimumResult.payoffMonth]
          .filter(m => m !== null);
        const horizonMonths = candidateMonths.length > 0 ? Math.min(360, Math.max(...candidateMonths) + 2) : 360;

        const tickStep = this.computeDebtTickStep(horizonMonths);

        const results = { strategy: strategyResult, current: currentResult, minimum: minimumResult };
        const activeResult = results[this.activeDebtView] || strategyResult;

        const trimmed = activeResult.projections.filter(p => p.month <= horizonMonths);
        const allValues = [strategyResult, currentResult, minimumResult]
          .flatMap(r => r.projections.filter(p => p.month <= horizonMonths).map(p => p.value));
        const globalMax = Math.max(0, ...allValues);
        const yAxisMax = globalMax > 0 ? globalMax * 1.05 : undefined;

        // Full readable date labels stored separately for tooltip display
        const dateLabels = trimmed.map(p => {
          if (p.month === 0) return 'Now';
          const d = new Date();
          d.setMonth(d.getMonth() + p.month);
          return d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
        });

        // Sparse tick labels for x-axis display - only show at tickStep intervals
        const labels = trimmed.map(p => this.formatDebtMonthLabel(p.month, horizonMonths, tickStep));
        const principalData = trimmed.map(p => this.roundCurrency(p.principal));
        const interestData = trimmed.map(p => this.roundCurrency(p.interestAccrued));

        const ctx = document.getElementById('debtHorizonChart');
        if (!ctx) return;

        const style = getComputedStyle(document.documentElement);
        const dangerColor = style.getPropertyValue('--danger').trim();
        const mutedColor = style.getPropertyValue('--text-secondary').trim();
        const gridColor = style.getPropertyValue('--border').trim();
        const principalColor = this.getCategoryColor(1);
        const interestColor = this.getCategoryColor(5);

        if (this.debtChart) {
          this.debtChart.destroy();
        }

        const yScaleConfig = {
          stacked: true,
          grid: { color: gridColor },
          ticks: {
            color: mutedColor,
            font: { family: 'Plus Jakarta Sans', size: 10 },
            callback: function(value) {
              if (value >= 1e6) return '$' + (value / 1e6).toFixed(1) + 'M';
              if (value >= 1e3) return '$' + (value / 1e3).toFixed(0) + 'k';
              return '$' + value;
            }
          }
        };
        if (yAxisMax !== undefined) {
          yScaleConfig.min = 0;
          yScaleConfig.max = yAxisMax;
        }

        let goalMonthIndex = null;
        if (this.debtInputs.targetDebtFreeDate) {
          const goalDate = new Date(this.debtInputs.targetDebtFreeDate);
          const today = new Date();
          const monthsOut = (goalDate.getFullYear() - today.getFullYear()) * 12 + (goalDate.getMonth() - today.getMonth());
          if (monthsOut >= 0 && monthsOut <= horizonMonths) goalMonthIndex = monthsOut;
        }

        const markers = [
          { index: goalMonthIndex, color: dangerColor, label: 'Goal' },
          {
            index: (activeResult.interestExceedsPrincipalMonth !== null && activeResult.interestExceedsPrincipalMonth <= horizonMonths) ? activeResult.interestExceedsPrincipalMonth : null,
            color: interestColor,
            label: 'Interest > Principal Paid'
          },
          {
            index: (activeResult.payoffMonth !== null && activeResult.payoffMonth <= horizonMonths) ? activeResult.payoffMonth : null,
            color: principalColor,
            label: 'Debt-Free'
          },
        ].filter(m => m.index !== null);

        const self = this;
        this.debtChart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [
              {
                label: 'Principal Remaining',
                data: principalData,
                borderColor: principalColor,
                backgroundColor: principalColor,
                borderWidth: 2,
                pointRadius: 0,
                pointHoverRadius: 5,
                fill: 'origin',
                stack: 'debt',
                tension: 0.2
              },
              {
                label: 'Accrued Interest',
                data: interestData,
                borderColor: interestColor,
                backgroundColor: interestColor,
                borderWidth: 2,
                pointRadius: 0,
                pointHoverRadius: 5,
                fill: '-1',
                stack: 'debt',
                tension: 0.2
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: true,
                position: 'top',
                align: 'end',
                labels: {
                  color: mutedColor,
                  font: { family: 'Plus Jakarta Sans', size: 10 },
                  boxWidth: 10,
                  boxHeight: 10,
                  usePointStyle: true,
                  pointStyle: 'circle'
                }
              },
              tooltip: {
                mode: 'index',
                intersect: false,
                callbacks: {
                  title: (tooltipItems) => {
                    if (!tooltipItems.length) return '';
                    const idx = tooltipItems[0].dataIndex;
                    return dateLabels[idx] || '';
                  },
                  label: (item) => ` ${item.dataset.label}: ${self.formatCurrency(item.parsed.y)}`,
                  afterBody: (tooltipItems) => {
                    if (!tooltipItems.length) return [];
                    const idx = tooltipItems[0].dataIndex;
                    const total = (principalData[idx] || 0) + (interestData[idx] || 0);
                    return [``, ` Total Balance: ${self.formatCurrency(total)}`];
                  }
                }
              },
              annotation: {
                annotations: this.buildMarkerAnnotations(markers)
              }
            },
            scales: {
              x: {
                stacked: true,
                grid: { display: false },
                ticks: {
                  color: mutedColor,
                  font: { family: 'Plus Jakarta Sans', size: 10 },
                  // autoSkip disabled because we control which positions get
                  // labels via empty strings - Chart.js auto-reduction would
                  // override our minimum-8-tick guarantee.
                  autoSkip: false,
                  maxRotation: 0,
                  callback: function(val, index) {
                    // Only render the label if it's non-empty
                    return labels[index] || null;
                  }
                }
              },
              y: yScaleConfig
            },
            interaction: {
              intersect: false,
              mode: 'index'
            }
          }
        });
      }

      updateBreakdownValues() {
        const totalMonthly = this.getSpendingTotals();
        const breakdownItems = document.querySelectorAll('.breakdown-item');
        const periods = {
          daily: totalMonthly / 30,
          weekly: totalMonthly / 4.286,
          biweekly: totalMonthly / 2.143,
          monthly: totalMonthly,
          yearly: totalMonthly * 12,
        };

        breakdownItems.forEach(item => {
          const period = item.getAttribute('data-breakdown-period');
          const valueEl = item.querySelector('.breakdown-value');
          if (valueEl) {
            valueEl.textContent = this.formatCurrency(periods[period] || 0);
          }
        });
      }

      attachEventListeners() {
        if (this.activeTab === 'paycheck') {
          this.attachPaycheckListeners();
        } else if (this.activeTab === 'spending') {
          this.attachSpendingListeners();
        } else if (this.activeTab === 'retirement') {
          this.attachMetricTileListeners();
        } else if (this.activeTab === 'debt') {
          this.attachMetricTileListeners();
        }
        // Apply currency formatting to all newly rendered inputs.
        // initCurrencyInput is idempotent so re-calling on existing inputs is safe.
        this.attachCurrencyInputs();
      }

      attachPaycheckListeners() {
        this.attachPcEvents();
      }

      attachSpendingListeners() {
        this.attachCategoryEventListeners();
        this.attachAddCategoryButton();
        this.attachSortButton();
        this.attachPercentageToggle();
        this.attachBreakdownItemListeners();
      }

      // Shared long-press/hover handler for any "hover to reveal breakdown"
      // metric tile - used by both the Retirement and Debt tabs since they
      // share the same .ret-net-worth-tile markup and interaction pattern.
      attachMetricTileListeners() {
        if (!this.isTouchDevice) return;
        const tiles = document.querySelectorAll('.ret-net-worth-tile');
        tiles.forEach(tile => {
          let pressTimer = null;

          if (tile._nwTouchStart) tile.removeEventListener('touchstart', tile._nwTouchStart);
          if (tile._nwTouchEnd) tile.removeEventListener('touchend', tile._nwTouchEnd);
          if (tile._nwTouchMove) tile.removeEventListener('touchmove', tile._nwTouchMove);

          tile._nwTouchStart = () => {
            pressTimer = setTimeout(() => {
              tile.classList.toggle('show-breakdown');
            }, 500);
          };
          tile._nwTouchEnd = () => {
            if (pressTimer) clearTimeout(pressTimer);
          };
          tile._nwTouchMove = () => {
            if (pressTimer) clearTimeout(pressTimer);
          };

          tile.addEventListener('touchstart', tile._nwTouchStart, { passive: true });
          tile.addEventListener('touchend', tile._nwTouchEnd, { passive: true });
          tile.addEventListener('touchmove', tile._nwTouchMove, { passive: true });
        });
      }

      attachCategoryEventListeners() {
        Object.keys(this.spendingCategories).forEach(categoryKey => {
          const categoryEl = document.querySelector(`[data-category-key="${categoryKey}"]`);
          if (!categoryEl) return;

          const addBtn = categoryEl.querySelector('.add-btn');
          if (addBtn) {
            addBtn.removeEventListener('click', addBtn.clickHandler);
            addBtn.clickHandler = (e) => {
              e.preventDefault();
              e.stopPropagation();
              this.addSubcategoryItem(categoryKey);
            };
            addBtn.addEventListener('click', addBtn.clickHandler);
          }

          const categoryNameEl = categoryEl.querySelector('.category-name');
          if (categoryNameEl) {
            categoryNameEl.removeEventListener('click', categoryNameEl.clickHandler);
            categoryNameEl.clickHandler = (e) => {
              e.preventDefault();
              e.stopPropagation();
              this.editCategoryName(categoryKey, categoryNameEl);
            };
            categoryNameEl.addEventListener('click', categoryNameEl.clickHandler);
          }

          this.attachInputListeners(categoryKey);
          this.attachRemoveButtons(categoryKey);
          this.attachHideButtons(categoryKey);
        });
      }

      attachInputListeners(categoryKey) {
        const categoryEl = document.querySelector(`[data-category-key="${categoryKey}"]`);
        if (!categoryEl) return;

        const inputs = categoryEl.querySelectorAll('[data-input-type]');
        inputs.forEach(input => {
          input.removeEventListener('focus', input.focusHandler);
          input.removeEventListener('change', input.changeHandler);

          // Clear zero on focus for non-currency text inputs (label field).
          // Currency inputs handle their own focus via initCurrencyInput.
          if (!input.dataset.currency) {
            input.focusHandler = (e) => {
              if (e.target.value === '0' || e.target.value === '0.00') {
                e.target.value = '';
              }
            };
            input.addEventListener('focus', input.focusHandler);
          }

          input.changeHandler = (e) => {
            const itemIndex = e.target.getAttribute('data-item-index') ? parseInt(e.target.getAttribute('data-item-index')) : 0;
            const field = e.target.getAttribute('data-field');
            let value = e.target.value;

            if (field === 'value') {
              // Strip commas inserted by the currency formatter before parsing
              value = this.parseCurrencyInput(e.target);
            } else if (field !== 'label' && field !== 'frequency') {
              value = Number(value) || 0;
            }

            if (!this.spendingCategories[categoryKey].items[itemIndex]) {
              this.spendingCategories[categoryKey].items[itemIndex] = { label: '', value: 0, frequency: 'monthly', hidden: false };
            }
            this.spendingCategories[categoryKey].items[itemIndex][field] = value;

            this.updateAllCategoryTotals();
            this.updateChartData();
            this.updateBreakdownValues();
          };

          input.addEventListener('change', input.changeHandler);
          input.addEventListener('input', input.changeHandler);
        });
      }

      attachRemoveButtons(categoryKey) {
        const categoryEl = document.querySelector(`[data-category-key="${categoryKey}"]`);
        if (!categoryEl) return;

        const removeBtns = categoryEl.querySelectorAll('.remove-btn');
        removeBtns.forEach(btn => {
          btn.removeEventListener('click', btn.clickHandler);
          btn.clickHandler = (e) => {
            e.preventDefault();
            e.stopPropagation();
            const itemIndex = parseInt(e.currentTarget.getAttribute('data-item-index'));
            this.removeSubcategoryItem(categoryKey, itemIndex);
          };
          btn.addEventListener('click', btn.clickHandler);
        });
      }

      // Lets the user flip a line item out of the calculation without
      // deleting it, so they can compare "with this expense" vs "without
      // it" (e.g. a daily bubble tea, a debt line, a hypothetical
      // retirement account) by toggling back and forth.
      attachHideButtons(categoryKey) {
        const categoryEl = document.querySelector(`[data-category-key="${categoryKey}"]`);
        if (!categoryEl) return;

        const hideBtns = categoryEl.querySelectorAll('.hide-btn');
        hideBtns.forEach(btn => {
          btn.removeEventListener('click', btn.clickHandler);
          btn.clickHandler = (e) => {
            e.preventDefault();
            e.stopPropagation();
            const itemIndex = parseInt(e.currentTarget.getAttribute('data-item-index'));
            this.toggleSubcategoryHidden(categoryKey, itemIndex);
          };
          btn.addEventListener('click', btn.clickHandler);
        });
      }

      toggleSubcategoryHidden(categoryKey, itemIndex) {
        const item = this.spendingCategories[categoryKey].items[itemIndex];
        if (!item) return;
        item.hidden = !item.hidden;

        const categoryEl = document.querySelector(`[data-category-key="${categoryKey}"]`);
        if (categoryEl) {
          const row = categoryEl.querySelector(`.subcategory-item[data-item-index="${itemIndex}"]`);
          if (row) {
            row.classList.toggle('item-hidden', item.hidden);

            const hideBtn = row.querySelector('.hide-btn');
            if (hideBtn) {
              hideBtn.classList.toggle('is-hidden', item.hidden);
              hideBtn.innerHTML = this.getEyeIconSVG(item.hidden);
              const label = item.hidden ? 'Unhide - include in calculations' : 'Hide - exclude from calculations';
              hideBtn.title = label;
              hideBtn.setAttribute('aria-label', item.hidden ? 'Unhide item' : 'Hide item');
              hideBtn.setAttribute('aria-pressed', String(item.hidden));
            }

            let tag = row.querySelector('.hidden-tag');
            if (item.hidden && !tag) {
              row.insertAdjacentHTML('beforeend', `<span class="hidden-tag">Hidden - excluded from totals</span>`);
            } else if (!item.hidden && tag) {
              tag.remove();
            }
          }
        }

        this.updateCategoryTotal(categoryKey);
        this.updateChartData();
        this.updateBreakdownValues();
      }

      attachSortButton() {
        const sortBtn = document.querySelector('.sort-btn');
        if (sortBtn) {
          sortBtn.removeEventListener('click', sortBtn.clickHandler);
          sortBtn.clickHandler = (e) => {
            e.preventDefault();
            e.stopPropagation();
            this.sortCategoriesByPercentage();
          };
          sortBtn.addEventListener('click', sortBtn.clickHandler);
        }
      }

      sortCategoriesByPercentage() {
        const totalSpending = this.getSpendingTotals();
        if (totalSpending === 0) return;

        const categoryArray = Object.entries(this.spendingCategories)
          .map(([key, category]) => ({
            key,
            percentage: (this.getCategoryMonthlyTotal(key) / totalSpending) * 100,
          }))
          .sort((a, b) => b.percentage - a.percentage);

        const spendingCategoriesWrapper = document.querySelector('.spending-categories-wrapper');
        if (!spendingCategoriesWrapper) return;

        const categoryElements = {};
        categoryArray.forEach(({ key }) => {
          const categoryEl = document.querySelector(`[data-category-key="${key}"]`);
          if (categoryEl) {
            categoryElements[key] = categoryEl.cloneNode(true);
          }
        });

        spendingCategoriesWrapper.innerHTML = '';
        categoryArray.forEach(({ key }) => {
          if (categoryElements[key]) {
            spendingCategoriesWrapper.appendChild(categoryElements[key]);
          }
        });

        this.attachCategoryEventListeners();
      }

      attachPercentageToggle() {
        const categoryTotals = document.querySelectorAll('.category-total');
        categoryTotals.forEach(total => {
          total.removeEventListener('dblclick', total.dblclickHandler);
          total.dblclickHandler = (e) => {
            e.preventDefault();
            e.stopPropagation();
            this.showPercentageToggle = !this.showPercentageToggle;
            this.updateAllCategoryTotals();
          };
          total.addEventListener('dblclick', total.dblclickHandler);

          if (this.isTouchDevice) {
            total.removeEventListener('touchend', total.touchendHandler);
            total.touchendHandler = (e) => {
              const currentTime = new Date().getTime();
              const tapLength = currentTime - (total.lastTap || 0);
              
              if (tapLength < 300 && tapLength > 0) {
                e.preventDefault();
                e.stopPropagation();
                this.showPercentageToggle = !this.showPercentageToggle;
                this.updateAllCategoryTotals();
              }
              total.lastTap = currentTime;
            };
            total.addEventListener('touchend', total.touchendHandler);
          }
        });
      }

      attachBreakdownItemListeners() {
        const breakdownItems = document.querySelectorAll('.breakdown-item');
        breakdownItems.forEach(item => {
          item.removeEventListener('click', item.clickHandler);
          item.clickHandler = (e) => {
            e.preventDefault();
            e.stopPropagation();
            const targetInterval = item.getAttribute('data-breakdown-period');
            this.switchInterval(targetInterval, item);
          };
          item.addEventListener('click', item.clickHandler);
        });
      }

      switchInterval(targetFrequency, triggerElement) {
        if (this.currentInterval === targetFrequency) return;
        
        this.currentInterval = targetFrequency;

        document.querySelectorAll('.breakdown-item').forEach(item => item.classList.remove('active'));
        triggerElement.classList.add('active');

        this.updateChartDisplay();

        if (this.timeScaleRefreshChart) {
          const scaledState = this.evaluateChartArrays();
          this.timeScaleRefreshChart.data.datasets[0].data = scaledState.values;
          this.timeScaleRefreshChart.update();
        }
      }

      updateChartDisplay() {
        const centerDisplay = document.getElementById('lockedCenterDisplay');
        const centerLabel = document.getElementById('centerLabelDisplay');
        if (centerDisplay && centerLabel) {
          const rawMonthlySum = this.getSpendingTotals();
          const activeScaledSum = this.getScaledValue(rawMonthlySum);
          centerDisplay.innerText = `$${activeScaledSum.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
          const labels = { daily: 'Daily', weekly: 'Weekly', biweekly: 'Bi-weekly', monthly: 'Monthly', yearly: 'Yearly' };
          centerLabel.innerText = labels[this.currentInterval] || 'Monthly';
        }

        // Keep the disposable row in sync with the active interval whenever
        // it exists (only rendered when paystub data is present).
        const disposableEl = document.getElementById('disposableDisplay');
        if (disposableEl) {
          const paycheck = this.getPaycheckTotals();
          const totalSpending = this.getSpendingTotals();
          const monthlyNet = paycheck.biMonthlyPaycheck * 2;
          const disposableMonthly = monthlyNet - totalSpending;
          const scaledDisposable = this.getScaledValue(disposableMonthly);
          disposableEl.textContent = this.formatCurrency(scaledDisposable);
          disposableEl.className = `total-amount ${scaledDisposable >= 0 ? 'positive' : 'negative'}`;
        }
      }

      getScaledValue(baseVal) {
        const multipliers = {
          daily: 1 / 30,
          weekly: 1 / 4.286,
          biweekly: 1 / 2.143,
          monthly: 1,
          yearly: 12,
        };
        return baseVal * (multipliers[this.currentInterval] || 1);
      }

      buildBusinessModel() {
        const model = [];
        let categoryIndex = 0;
        Object.entries(this.spendingCategories).forEach(([categoryKey, category]) => {
          const categoryTotal = this.getCategoryMonthlyTotal(categoryKey);
          const categoryLabel = this.categoryLabels[categoryKey];
          const categoryColor = this.getCategoryColor(categoryIndex);
          
          let firstChild = true;
          category.items.forEach((item, itemIndex) => {
            if (item.hidden) return;
            model.push({
              categoryKey,
              categoryIndex,
              itemIndex,
              parentId: categoryKey,
              parentLabel: categoryLabel,
              parentTotal: categoryTotal,
              parentColor: categoryColor,
              subLabel: item.label || `Item ${itemIndex + 1}`,
              subValue: this.convertToMonthly(item.value || 0, item.frequency || 'monthly'),
              subColor: this.getCategoryColor(categoryIndex, 0.6 + (itemIndex * 0.15)),
              isFirstChild: firstChild,
            });
            firstChild = false;
          });
          categoryIndex++;
        });
        return model;
      }

      getCategoryColor(index, alpha = 1) {
        const colors = [
          '#D98A6C',
          '#6B8E66',
          '#E0B063',
          '#8F9779',
          '#5A7887',
          '#A36A75',
          '#4A5343',
          '#D1C2A5',
          '#7D6B7D',
          '#5C4D43'
        ];
        const color = colors[index % colors.length];
        if (alpha < 1) {
          const hex = color.replace('#', '');
          const r = parseInt(hex.substring(0, 2), 16);
          const g = parseInt(hex.substring(2, 4), 16);
          const b = parseInt(hex.substring(4, 6), 16);
          return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }
        return color;
      }

      // Identity-based color (keyed on account id, not array position) so an
      // account's color stays stable across sorts, additions, and deletions
      // instead of shifting whenever the underlying order changes.
      getAccountColor(accountId) {
        let hash = 0;
        for (let i = 0; i < accountId.length; i++) {
          hash = (hash * 31 + accountId.charCodeAt(i)) >>> 0;
        }
        return this.getCategoryColor(hash);
      }

      evaluateChartArrays() {
        const businessModel = this.buildBusinessModel();
        let values = [];
        let colors = [];
        let labels = [];

        businessModel.forEach((meta) => {
          if (this.activeExpandedCategoryId === meta.parentId) {
            values.push(this.getScaledValue(meta.subValue));
            colors.push(meta.subColor);
            labels.push(meta.subLabel);
          } else {
            if (meta.isFirstChild) {
              values.push(this.getScaledValue(meta.parentTotal));
              labels.push(meta.parentLabel);
            } else {
              values.push(0);
              labels.push("");
            }
            colors.push(meta.parentColor);
          }
        });

        return { values, colors, labels };
      }

      initChart() {
        const ctx = document.getElementById('timeScaleRefreshChart');
        if (!ctx) return;

        const initialState = this.evaluateChartArrays();

        let touchStartX = 0;
        let touchStartY = 0;
        let longPressTimer = null;
        let longPressFired = false;

        this.timeScaleRefreshChart = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: initialState.labels,
            datasets: [{
              data: initialState.values,
              backgroundColor: initialState.colors,
              borderWidth: 0,
              hoverOffset: 0
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '78%',
            devicePixelRatio: window.devicePixelRatio || 2,
            events: this.isTouchDevice ? [] : ['mousemove', 'mouseout', 'click', 'touchstart'],
            plugins: {
              legend: { display: false },
              tooltip: {
                enabled: true,
                backgroundColor: document.documentElement.getAttribute('data-theme') === 'dark' ? '#f5f3f0' : '#2d2d2d',
                titleColor: document.documentElement.getAttribute('data-theme') === 'dark' ? '#2a2620' : '#f5f3f0',
                titleFont: { family: 'Plus Jakarta Sans', size: 11, weight: '700', lineHeight: 1.5 },
                bodyColor: document.documentElement.getAttribute('data-theme') === 'dark' ? '#2a2620' : '#f5f3f0',
                bodyFont: { family: 'Plus Jakarta Sans', size: 13, weight: '400' },
                padding: { top: 10, bottom: 12, left: 14, right: 14 },
                cornerRadius: 8,
                displayColors: true,
                boxWidth: 7,
                boxHeight: 7,
                boxPadding: 8,
                usePointStyle: true,
                caretSize: 0,
                yAlign: 'bottom',
                xAlign: 'center',
                callbacks: {
                  title: (tooltipItems) => {
                    if (tooltipItems.length === 0) return '';
                    const idx = tooltipItems[0].dataIndex;
                    const businessModel = this.buildBusinessModel();
                    if (!businessModel[idx]) return '';
                    return businessModel[idx].parentLabel.toUpperCase();
                  },
                  label: (context) => {
                    const idx = context.dataIndex;
                    const businessModel = this.buildBusinessModel();
                    const meta = businessModel[idx];
                    if (!meta) return null;
                    const currentSliceValue = context.parsed;
                    if (currentSliceValue === 0) return null;

                    const rawMonthlySum = this.getSpendingTotals();
                    const globalScaledSum = this.getScaledValue(rawMonthlySum);

                    if (this.activeExpandedCategoryId === meta.parentId) {
                      const scaledSubValue = this.getScaledValue(meta.subValue);
                      const subPct = ((scaledSubValue / globalScaledSum) * 100).toFixed(1);
                      return ` ${meta.subLabel}  -  $${scaledSubValue.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} (${subPct}%)`;
                    } else {
                      const scaledMacroValue = this.getScaledValue(meta.parentTotal);
                      const macroPct = ((scaledMacroValue / globalScaledSum) * 100).toFixed(1);
                      return ` Total Spend  -  $${scaledMacroValue.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} (${macroPct}%)`;
                    }
                  }
                }
              }
            },
            onClick: (event, activeElements) => {
              if (this.isTouchDevice) return;
              if (!activeElements || activeElements.length === 0) return;

              const targetElementIdx = activeElements[0].index;
              const businessModelArray = this.buildBusinessModel();
              const metadataItem = businessModelArray[targetElementIdx];
              if (!metadataItem) return;

              const currentValue = this.timeScaleRefreshChart.data.datasets[0].data[targetElementIdx];
              if (currentValue === 0) return;

              if (this.activeExpandedCategoryId === metadataItem.parentId) {
                this.activeExpandedCategoryId = null;
              } else {
                this.activeExpandedCategoryId = metadataItem.parentId;
              }

              const nextStateValues = this.evaluateChartArrays();
              this.timeScaleRefreshChart.data.labels = nextStateValues.labels;
              this.timeScaleRefreshChart.data.datasets[0].data = nextStateValues.values;
              this.timeScaleRefreshChart.data.datasets[0].backgroundColor = nextStateValues.colors;
              this.timeScaleRefreshChart.update();
            }
          }
        });

        if (this.isTouchDevice) {
          const getElementAtTouch = (touch) => {
            const elements = this.timeScaleRefreshChart.getElementsAtEventForMode(
              touch, 'nearest', { intersect: true }, false
            );
            return elements && elements.length > 0 ? elements[0] : null;
          };

          ctx.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            longPressFired = false;

            this.timeScaleRefreshChart.tooltip.setActiveElements([], {});
            this.timeScaleRefreshChart.update('none');

            longPressTimer = setTimeout(() => {
              longPressFired = true;
              const element = getElementAtTouch(e.touches[0]);
              if (!element) return;

              const targetElementIdx = element.index;
              const businessModelArray = this.buildBusinessModel();
              const metadataItem = businessModelArray[targetElementIdx];
              if (!metadataItem) return;

              const currentValue = this.timeScaleRefreshChart.data.datasets[0].data[targetElementIdx];
              if (currentValue === 0) return;

              if (this.activeExpandedCategoryId === metadataItem.parentId) {
                this.activeExpandedCategoryId = null;
              } else {
                this.activeExpandedCategoryId = metadataItem.parentId;
              }

              const nextStateValues = this.evaluateChartArrays();
              this.timeScaleRefreshChart.data.labels = nextStateValues.labels;
              this.timeScaleRefreshChart.data.datasets[0].data = nextStateValues.values;
              this.timeScaleRefreshChart.data.datasets[0].backgroundColor = nextStateValues.colors;
              this.timeScaleRefreshChart.update();
            }, 500);
          }, { passive: false });

          ctx.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (longPressTimer) {
              clearTimeout(longPressTimer);
              longPressTimer = null;
            }

            if (longPressFired) return;

            const touch = e.changedTouches[0];
            const deltaX = Math.abs(touch.clientX - touchStartX);
            const deltaY = Math.abs(touch.clientY - touchStartY);
            if (deltaX > 10 || deltaY > 10) return;

            const element = getElementAtTouch(touch);
            if (!element) {
              this.timeScaleRefreshChart.tooltip.setActiveElements([], {});
              this.timeScaleRefreshChart.update('none');
              return;
            }

            const targetElementIdx = element.index;
            const currentValue = this.timeScaleRefreshChart.data.datasets[0].data[targetElementIdx];
            if (currentValue === 0) return;

            this.timeScaleRefreshChart.tooltip.setActiveElements(
              [{ datasetIndex: 0, index: targetElementIdx }],
              { x: touch.clientX, y: touch.clientY }
            );
            this.timeScaleRefreshChart.update('none');
          }, { passive: false });

          ctx.addEventListener('touchmove', (e) => {
            const deltaX = Math.abs(e.touches[0].clientX - touchStartX);
            const deltaY = Math.abs(e.touches[0].clientY - touchStartY);
            if (deltaX > 10 || deltaY > 10) {
              if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
              }
            }
          }, { passive: true });

          document.addEventListener('touchend', (e) => {
            const chartContainerEl = document.querySelector('.chart-container');
            if (chartContainerEl && !chartContainerEl.contains(e.target)) {
              if (this.timeScaleRefreshChart) {
                this.timeScaleRefreshChart.tooltip.setActiveElements([], {});
                this.timeScaleRefreshChart.update('none');
              }
            }
          }, { passive: true });
        }

        this.updateChartDisplay();
      }

      editCategoryName(categoryKey, nameEl) {
        const currentName = this.categoryLabels[categoryKey];
        nameEl.classList.add('editing');
        
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'category-name-input';
        input.value = currentName;
        input.setAttribute('aria-label', `Edit category name for ${currentName}`);
        
        nameEl.replaceWith(input);
        input.select();

        const saveEdit = () => {
          const newName = input.value.trim() || currentName;
          this.categoryLabels[categoryKey] = newName;
          
          const categoryEl = document.querySelector(`[data-category-key="${categoryKey}"]`);
          if (categoryEl) {
            const headerEl = categoryEl.querySelector('.category-header');
            if (headerEl) {
              const oldInput = headerEl.querySelector('.category-name-input');
              const nameSpan = document.createElement('span');
              nameSpan.className = 'category-name';
              nameSpan.textContent = newName;
              
              if (oldInput) {
                oldInput.replaceWith(nameSpan);
              }
              
              this.attachCategoryEventListeners();
              this.updateChartData();
            }
          }
        };

        input.addEventListener('blur', saveEdit);
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            saveEdit();
          }
        });
      }

      addNewCategory() {
        const categoryKey = `custom-${this.nextCustomCategoryId}`;
        this.nextCustomCategoryId++;
        this.spendingCategories[categoryKey] = { items: [{ label: '', value: 0, frequency: 'monthly' }], isCustom: true };
        this.categoryLabels[categoryKey] = 'New Category';
        this.categoryPlaceholders[categoryKey] = '';
        
        const spendingCategoriesWrapper = document.querySelector('.spending-categories-wrapper');
        if (spendingCategoriesWrapper) {
          const categoryHTML = this.renderSpendingCategoryHTML(categoryKey, this.spendingCategories[categoryKey]);
          spendingCategoriesWrapper.insertAdjacentHTML('beforeend', categoryHTML);
          
          this.attachCategoryEventListeners();
          this.updateChartData();

          setTimeout(() => {
            const categoryNameEl = document.querySelector(`[data-category-key="${categoryKey}"] .category-name`);
            if (categoryNameEl) {
              this.editCategoryName(categoryKey, categoryNameEl);
            }
          }, 50);
        }
      }

      attachAddCategoryButton() {
        const addCategoryBtn = document.querySelector('.add-category-btn');
        if (addCategoryBtn) {
          addCategoryBtn.removeEventListener('click', addCategoryBtn.clickHandler);
          addCategoryBtn.clickHandler = (e) => {
            e.preventDefault();
            e.stopPropagation();
            this.addNewCategory();
          };
          addCategoryBtn.addEventListener('click', addCategoryBtn.clickHandler);
        }
      }

      updateAllCategoryTotals() {
        Object.keys(this.spendingCategories).forEach(categoryKey => {
          this.updateCategoryTotal(categoryKey);
        });
      }

      updateCategoryTotal(categoryKey) {
        const categoryElement = document.querySelector(`[data-category-total="${categoryKey}"]`);
        if (categoryElement) {
          const total = this.getCategoryMonthlyTotal(categoryKey);
          const percentage = this.getCategoryPercentage(categoryKey);
          const tooltipText = `Monthly total (from mixed frequencies) - ${percentage}% of total spending`;
          const totalDisplay = this.showPercentageToggle
            ? `${this.formatCurrency(total)} (${percentage}%)`
            : this.formatCurrency(total);
          categoryElement.innerHTML = `${totalDisplay}<div class="tooltip">${tooltipText}</div>`;
        }
      }

      updateChartData() {
        if (this.timeScaleRefreshChart) {
          const nextStateValues = this.evaluateChartArrays();
          this.timeScaleRefreshChart.data.labels = nextStateValues.labels;
          this.timeScaleRefreshChart.data.datasets[0].data = nextStateValues.values;
          this.timeScaleRefreshChart.data.datasets[0].backgroundColor = nextStateValues.colors;
          this.timeScaleRefreshChart.update();
        }
        this.updateChartDisplay();
      }

      getCategoryPercentage(categoryKey) {
        const totalSpending = this.getSpendingTotals();
        if (totalSpending === 0) return 0;
        const categoryTotal = this.getCategoryMonthlyTotal(categoryKey);
        return ((categoryTotal / totalSpending) * 100).toFixed(1);
      }

      addSubcategoryItem(categoryKey) {
        const category = this.spendingCategories[categoryKey];
        category.items.push({
          label: '',
          value: 0,
          frequency: 'monthly',
          hidden: false,
        });

        const categoryEl = document.querySelector(`[data-category-key="${categoryKey}"]`);
        if (!categoryEl) return;

        const categoryBody = categoryEl.querySelector('.category-body');
        if (!categoryBody) return;

        const itemIndex = category.items.length - 1;
        const itemHTML = this.renderSubcategoryItemHTML(categoryKey, this.categoryLabels[categoryKey], category.items[itemIndex], itemIndex);
        categoryBody.insertAdjacentHTML('beforeend', itemHTML);

        this.attachInputListeners(categoryKey);
        this.attachRemoveButtons(categoryKey);
        this.attachHideButtons(categoryKey);
        this.attachCurrencyInputs(categoryBody);

        const newInput = categoryBody.querySelector(`[data-item-index="${itemIndex}"][data-field="label"]`);
        if (newInput) {
          setTimeout(() => newInput.focus(), 50);
        }
      }

      removeSubcategoryItem(categoryKey, itemIndex) {
        const category = this.spendingCategories[categoryKey];
        const categoryEl = document.querySelector(`[data-category-key="${categoryKey}"]`);
        if (!categoryEl) return;

        category.items.splice(itemIndex, 1);

        if (category.items.length === 0) {
          categoryEl.style.animation = 'slideUp 0.3s ease-out reverse';
          setTimeout(() => {
            if (categoryEl.parentNode) {
              categoryEl.remove();
            }
            delete this.spendingCategories[categoryKey];
            delete this.categoryLabels[categoryKey];
            delete this.categoryPlaceholders[categoryKey];
            this.updateChartData();
            this.updateBreakdownValues();
          }, 300);
          return;
        }

        const categoryBody = categoryEl.querySelector('.category-body');
        if (categoryBody) {
          const itemElement = categoryBody.querySelector(`.subcategory-item[data-item-index="${itemIndex}"]`);
          if (itemElement) {
            itemElement.style.animation = 'slideInItem 0.3s ease-out reverse';
            setTimeout(() => {
              itemElement.remove();
              // Re-index remaining items only after the removed element is
              // gone from the DOM, so the NodeList is accurate.
              const remaining = categoryBody.querySelectorAll('.subcategory-item');
              remaining.forEach((item, idx) => {
                item.setAttribute('data-item-index', idx);
                item.querySelectorAll('[data-input-type="sub"]').forEach(input => {
                  input.setAttribute('data-item-index', idx);
                });
                const removeBtn = item.querySelector('.remove-btn');
                if (removeBtn) removeBtn.setAttribute('data-item-index', idx);
                const hideBtn = item.querySelector('.hide-btn');
                if (hideBtn) hideBtn.setAttribute('data-item-index', idx);
              });
            }, 300);
          }
        }

        this.updateCategoryTotal(categoryKey);
        this.updateChartData();
        this.updateBreakdownValues();
      }

      // handleImageCapture removed in v2 - replaced by handlePcImageCapture

      updatePaycheckDisplay() {
        // v2: no-op - paycheck tab does targeted refreshes via pcRefreshTotalsUI
      }

      getPaycheckTotals() {
        // Legacy compatibility shim - used by Spending tab for disposable calculation.
        // Derives from the new paycheckSections model and normalizes to monthly.
        const pcTotals = this.getPcTotals();
        const ppy = this.pcPaychecksPerYear();
        const annualGross = pcTotals.gross * ppy;
        const annualNet = pcTotals.net * ppy;
        const annualTaxes = pcTotals.taxes * ppy;
        const annualDeductions = pcTotals.deductions * ppy;

        const netPaycheck = annualNet / 12;           // monthly net
        const biMonthlyPaycheck = netPaycheck / 2;    // half-monthly
        const weeklyPaycheck = annualNet / 52;

        const totals = {
          grossPay: annualGross / 12,
          federalTax: 0, socialSecurityTax: 0, medicareTax: 0,
          stateTax: 0, cityTax: 0, sdiTax: 0, paidFamilyLeaveTax: 0,
          dental: 0, medical: 0, hsa: 0, retirement401k: 0,
        };

        return {
          totals,
          totalTaxes: annualTaxes / 12,
          totalBenefits: annualDeductions / 12,
          netPaycheck,
          biMonthlyPaycheck,
          weeklyPaycheck,
        };
      }

      escapeHtml(text) {
        const map = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, m => map[m]);
      }

      // Shared eye / eye-off icon for any hide-unhide toggle in the app
      // (spending line items, retirement accounts, debt accounts).
      getEyeIconSVG(isHidden) {
        if (isHidden) {
          return `<svg class="hide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
        }
        return `<svg class="hide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
      }

      // Single source of truth for a spending line-item row, used both by
      // the initial category render and by addSubcategoryItem so the two
      // paths can never drift out of sync.
      renderSubcategoryItemHTML(categoryKey, categoryLabel, item, itemIndex) {
        const isHidden = !!item.hidden;
        const safeLabel = this.escapeHtml(categoryLabel);
        return `
          <div class="subcategory-item${isHidden ? ' item-hidden' : ''}" data-item-index="${itemIndex}">
            <div class="subcategory-row">
              <input type="text" class="subcategory-input" data-input-type="sub" data-item-index="${itemIndex}" data-field="label" value="${this.escapeHtml(item.label || '')}" placeholder="" aria-label="Description for ${safeLabel} item">
              <input type="text" inputmode="decimal" class="subcategory-input currency-input" data-input-type="sub" data-item-index="${itemIndex}" data-field="value" data-currency="true" value="${item.value > 0 ? item.value.toFixed(2) : ''}" placeholder="0.00" aria-label="Amount for ${safeLabel} item">
              <select class="frequency-select" data-input-type="sub" data-item-index="${itemIndex}" data-field="frequency" aria-label="Frequency for ${safeLabel} item">
                <option value="daily" ${item.frequency === 'daily' ? 'selected' : ''}>Daily</option>
                <option value="weekly" ${item.frequency === 'weekly' ? 'selected' : ''}>Weekly</option>
                <option value="biweekly" ${item.frequency === 'biweekly' ? 'selected' : ''}>Bi-wk</option>
                <option value="monthly" ${item.frequency === 'monthly' ? 'selected' : ''}>Monthly</option>
                <option value="yearly" ${item.frequency === 'yearly' ? 'selected' : ''}>Yearly</option>
              </select>
              <div class="subcategory-actions">
                <button class="hide-btn${isHidden ? ' is-hidden' : ''}" data-item-index="${itemIndex}" title="${isHidden ? 'Unhide - include in calculations' : 'Hide - exclude from calculations'}" aria-label="${isHidden ? 'Unhide item' : 'Hide item'}" aria-pressed="${isHidden}">${this.getEyeIconSVG(isHidden)}</button>
                <button class="remove-btn" data-item-index="${itemIndex}" title="Remove this item" aria-label="Remove">&times;</button>
              </div>
            </div>
            ${isHidden ? `<span class="hidden-tag">Hidden - excluded from totals</span>` : ''}
          </div>
        `;
      }

      // renderPaycheckCardsHTML, renderTaxBreakdown, renderBenefitBreakdown,
      // and renderBudgetAllocation were removed in v2. The paycheck tab now
      // uses renderPaycheckTab() -> renderPcSectionHTML() -> renderPcLineHTML()
      // and the right panel methods (renderPcSummaryTiles, renderPcComposition,
      // renderPcBudgetGuideline). The legacy getPaycheckTotals() shim is kept
      // for the Spending tab's disposable income row.

      renderSpendingCategoryHTML(categoryKey, category) {
        const categoryLabel = this.categoryLabels[categoryKey];
        const categoryTotal = this.getCategoryMonthlyTotal(categoryKey);
        const categoryPercentage = this.getCategoryPercentage(categoryKey);

        const tooltipText = `Monthly total (from mixed frequencies) - ${categoryPercentage}% of total spending`;
        let totalDisplay = this.formatCurrency(categoryTotal);

        if (this.showPercentageToggle) {
          totalDisplay = `${this.formatCurrency(categoryTotal)} (${categoryPercentage}%)`;
        }

        let html = `<div class="spending-category" data-category-key="${categoryKey}">`;

        html += `
          <div class="category-header">
            <span class="category-name">${this.escapeHtml(categoryLabel)}</span>
            <div class="category-header-actions">
              <span class="category-total${this.showPercentageToggle ? ' show-percentage' : ''}" data-category-total="${categoryKey}" role="tooltip">
                ${totalDisplay}
                <div class="tooltip">${tooltipText}</div>
              </span>
              <button class="add-btn" title="Add item" aria-label="Add ${this.escapeHtml(categoryLabel)} item">+</button>
            </div>
          </div>
        `;

        html += `<div class="category-body">`;

        category.items.forEach((item, itemIndex) => {
          html += this.renderSubcategoryItemHTML(categoryKey, categoryLabel, item, itemIndex);
        });

        html += `</div>`;
        html += `</div>`;

        return html;
      }

      renderAggregatedSpendingCardHTML(totalMonthly, disposableMonthly = null) {
        const tipText = this.isTouchDevice 
          ? 'Tap a segment for details. Long press to expand into subcategories.'
          : 'Click a category to see its subcategories.';

        const scaledDisposable = disposableMonthly !== null ? this.getScaledValue(disposableMonthly) : null;
        const disposableRow = scaledDisposable !== null ? `
          <div class="total-row" style="margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border);">
            <span class="total-label">Disposable</span>
            <span id="disposableDisplay" class="total-amount ${scaledDisposable >= 0 ? 'positive' : 'negative'}">
              ${this.formatCurrency(scaledDisposable)}
            </span>
          </div>
        ` : '';

        return `
          <div class="card breakdown-card-wrapper">
            <div class="card-title">Total Spending & Breakdown</div>
            <div class="spending-breakdown">
              <div class="breakdown-item" data-breakdown-period="daily">
                <div class="breakdown-label">Daily</div>
                <div class="breakdown-value">${this.formatCurrency(totalMonthly / 30)}</div>
              </div>
              <div class="breakdown-item" data-breakdown-period="weekly">
                <div class="breakdown-label">Weekly</div>
                <div class="breakdown-value">${this.formatCurrency(totalMonthly / 4.286)}</div>
              </div>
              <div class="breakdown-item active" data-breakdown-period="monthly">
                <div class="breakdown-label">Monthly</div>
                <div class="breakdown-value">${this.formatCurrency(totalMonthly)}</div>
              </div>
              <div class="breakdown-item" data-breakdown-period="yearly">
                <div class="breakdown-label">Yearly</div>
                <div class="breakdown-value">${this.formatCurrency(totalMonthly * 12)}</div>
              </div>
            </div>

            <div class="chart-container">
              <canvas id="timeScaleRefreshChart"></canvas>
              <div class="chart-center-text">
                <div class="label" id="centerLabelDisplay">Monthly</div>
                <div class="total-amount" id="lockedCenterDisplay">$0.00</div>
              </div>
            </div>

            <div class="chart-tip">${tipText}</div>
            ${disposableRow}
          </div>
        `;
      }
    }

    let dashboard;
    document.addEventListener('DOMContentLoaded', () => {
      dashboard = new FinancialDashboard();
    });
  </script>
</body>
</html>
